aws-licences-and-permits/laws/laws-z/procedure-law-no-2025-100"}, "PRIV": {"en": "Municipal Freedom of Information and Protection of Privacy Act", "fr": "Loi sur l’accès à l’information municipale et la protection de la vie privée", "url": "https://www.ontario.ca/laws/statute/90m56"}, "CONTACT": {"en": "Councillor Wilson Lo — Ward 24 office", "fr": "Bureau du conseiller Wilson Lo — quartier 24", "url": "https://www.ward24.ca/"}}, "roles": {"resident": {"name": ["Neighbour", "Résidente ou résident"], "subtitle": ["See how a local concern becomes an evidence-based request.", "Transformez une préoccupation locale en demande étayée."], "icon": "🏡", "intro": ["You live in Barrhaven East. Your school commute, neighbourhood growth and changing weather all touch daily life. You cannot make a City decision alone, but you can help make information more complete and participation more inclusive.", "Vous habitez Barrhaven-Est. Les trajets scolaires, la croissance du quartier et les intempéries touchent votre quotidien. Vous ne décidez pas seul à la place de la Ville, mais vous pouvez enrichir les informations et favoriser la participation de tous."]}, "office": {"name": ["Ward office team", "Équipe du bureau de quartier"], "subtitle": ["Triage concerns fairly and communicate without over-promising.", "Traitez les demandes équitablement sans promettre l’impossible."], "icon": "🤝", "intro": ["You support the office serving Ward 24. A busy week brings traffic concerns, growth questions, stormwater reports and calls for accessible engagement. Your role is to listen, connect residents with the right process and explain what can happen next.", "Vous travaillez pour le bureau qui dessert le quartier 24. Cette semaine, on vous signale des problèmes de circulation, de croissance, de drainage et d’accessibilité. Votre tâche : écouter, orienter et expliquer les prochaines étapes."]}, "staff": {"name": ["City service designer", "Spécialiste des services municipaux"], "subtitle": ["Balance evidence, access, feasibility and accountability.", "Conciliez données, accessibilité, faisabilité et responsabilité."], "icon": "🏙️", "intro": ["You are a fictional City team lead tasked with testing ways to respond to several Ward 24 issues. Your recommendations must be technically sound, accessible, bilingual and honest about trade-offs; elected officials and residents will examine your process.", "Vous êtes responsable fictif d’une équipe municipale chargée d’examiner plusieurs enjeux du quartier 24. Vos propositions doivent être fondées sur des données, accessibles, bilingues et transparentes quant aux compromis."]}}, "scenes": {"resident": [{"id": "r1", "title": ["A crossing worries parents", "Un passage inquiète les parents"], "body": ["A parent near a busy Barrhaven East corridor reports unsafe crossing conditions during the morning rush. The details are incomplete, and another family uses a mobility aid.", "Près d’un axe très fréquenté de Barrhaven-Est, un parent signale une traversée difficile le matin. Les détails restent imprécis et une autre famille utilise une aide à la mobilité."], "question": ["What do you do first?", "Que faites-vous d’abord ?"], "source": "311", "options": [{"t": ["Document the place, time and access barrier; use 3-1-1 for the municipal issue and share the reference with the ward office.", "Notez le lieu, l’heure et l’obstacle d’accessibilité; signalez le problème au 3-1-1 et transmettez la référence au bureau du quartier."], "why": ["Specific facts make a request actionable. 3-1-1 is a municipal service channel; the ward office can follow up but does not replace operational assessment.", "Des faits précis permettent d’agir. Le 3-1-1 est un canal municipal; le bureau du quartier peut assurer un suivi sans remplacer l’analyse opérationnelle."], "points": 20, "delta": [6, 5, 6], "tag": "evidence"}, {"t": ["Write to the ward office with a clear description but do not document when or how the barrier occurs.", "Écrivez au bureau du quartier en décrivant la situation, sans préciser quand ni comment l’obstacle se présente."], "why": ["The office can help direct the concern, but missing details slow verification. Add context or use an official service request too.", "Le bureau peut orienter la demande, mais le manque de détails ralentit la vérification. Ajoutez du contexte ou utilisez aussi une demande officielle."], "points": 10, "delta": [1, 0, 1], "tag": "partial"}, {"t": ["Post an identifiable photo of the family online and accuse City staff of ignoring the problem.", "Publiez une photo permettant d’identifier la famille et accusez le personnel municipal d’inaction."], "why": ["That puts privacy at risk and does not create a reliable service record. Record conditions without disclosing personal identities.", "Cela peut nuire à la vie privée et ne crée pas de dossier de service fiable. Décrivez le contexte sans révéler l’identité des personnes."], "points": 0, "delta": [-8, -8, -6], "tag": "privacy"}], "voice": ["“My son needs more time to cross, and our neighbour uses a walker.” — fictional resident", "« Mon fils a besoin de plus de temps pour traverser, et notre voisine utilise une marchette. » — témoignage fictif"]}, {"id": "r2", "title": ["A transit headline spreads", "Une rumeur circule sur le transport"], "body": ["An online post claims that Barrhaven commute times have doubled. People are upset, but the post gives neither a period nor a route. You find Ottawa’s Mobility Dashboard.", "Une publication affirme que les temps de déplacement à Barrhaven ont doublé. Les gens sont inquiets, mais aucun itinéraire ni période n’est indiqué. Vous trouvez le tableau de bord municipal."], "question": ["What information would strengthen a constructive conversation?", "Quelle information renforcerait un échange constructif ?"], "source": "MOB", "options": [{"t": ["Ask for specific stops and times, compare trends carefully and explain that dashboard figures are not real-time route predictions.", "Demandez les arrêts et les heures concernés, comparez prudemment les tendances et précisez que le tableau de bord n’est pas un outil de prévision en temps réel."], "why": ["The dashboard offers weekly trends from selected locations. It is useful context, not proof about every journey.", "Le tableau de bord présente des tendances hebdomadaires sur des lieux sélectionnés. C’est un contexte utile, pas une preuve applicable à tous les trajets."], "points": 20, "delta": [3, 6, 5], "tag": "evidence"}, {"t": ["Forward the dashboard link alone and assume it settles all residents’ experiences.", "Transmettez seulement le lien vers le tableau de bord et supposez qu’il règle tous les témoignages."], "why": ["A source link is helpful, but residents’ access and trip patterns differ. Add a plain-language explanation and invite specific observations.", "Le lien est utile, mais les besoins et trajets diffèrent. Ajoutez une explication claire et invitez les observations précises."], "points": 10, "delta": [0, 2, 0], "tag": "partial"}, {"t": ["Treat the social-media claim as established fact and request a specific funding decision immediately.", "Présentez l’affirmation sur les réseaux sociaux comme un fait établi et exigez immédiatement une décision budgétaire précise."], "why": ["Policy requests should be grounded in evidence and transparent trade-offs. Unsupported claims make collaborative problem-solving harder.", "Les demandes de politique publique doivent reposer sur des données et des compromis transparents. Une affirmation non vérifiée nuit à la collaboration."], "points": 0, "delta": [-6, -8, -5], "tag": "claim"}], "voice": ["“The route feels different every day. Does the dashboard show my stop?” — fictional commuter", "« Le trajet change chaque jour. Le tableau de bord couvre-t-il mon arrêt ? » — personne fictive"]}, {"id": "r3", "title": ["Growth brings different needs", "La croissance suscite des besoins différents"], "body": ["A fictional proposal near an existing Woodroffe corridor prompts questions about traffic, private wells, parking and housing supply. Ward 24 has reported real discussion of these topics, but the proposal in this game is fictional.", "Un projet fictif près de l’axe Woodroffe soulève des questions de circulation, de puits privés, de stationnement et de logement. Le quartier 24 a évoqué ces enjeux réels, mais le projet du jeu est inventé."], "question": ["How do you participate without assuming the outcome?", "Comment participer sans présumer du résultat ?"], "source": "NEWS", "options": [{"t": ["Read the actual application and public record, identify concrete impacts, submit evidence through the appropriate planning channel and hear different neighbours.", "Consultez le dossier public, identifiez les effets concrets, transmettez vos observations par le canal d’urbanisme approprié et écoutez divers voisins."], "why": ["Planning decisions involve legislation, technical studies and public input. Evidence-based questions can inform conditions and mitigations without guaranteeing an outcome.", "L’urbanisme dépend des lois, des études techniques et de la participation. Des questions documentées peuvent éclairer les mesures d’atténuation sans garantir un résultat."], "points": 20, "delta": [5, 6, 4], "tag": "evidence"}, {"t": ["Circulate a petition without identifying which aspects of the proposal are disputed.", "Faites circuler une pétition sans préciser quels éléments du projet font débat."], "why": ["A petition can signal concern but rarely answers technical questions by itself. Clarify the issues and the right procedural channel.", "Une pétition peut signaler une inquiétude, mais ne répond pas à elle seule aux questions techniques. Précisez les enjeux et le canal officiel."], "points": 10, "delta": [1, 1, 1], "tag": "partial"}, {"t": ["Share unverified private-well results attributed to a neighbour by name.", "Diffuser des résultats non vérifiés concernant un puits privé en nommant le voisin."], "why": ["Unverified personal information can harm trust and privacy. Seek consent and rely on disclosed evidence and official review processes.", "Des données personnelles non vérifiées peuvent nuire à la confiance et à la vie privée. Demandez le consentement et appuyez-vous sur des études disponibles."], "points": 0, "delta": [-7, -7, -6], "tag": "privacy"}], "voice": ["“We need homes, but also safe roads and water protection.” — fictional neighbour", "« Il faut des logements, mais aussi des routes sûres et protéger l’eau. » — personne fictive"]}, {"id": "r4", "title": ["The stormwater alert", "Une alerte au drainage"], "body": ["After a heavy rainfall, a neighbour sees a blocked catch basin and water approaching a sidewalk. Another message alleges a serious emergency, but that has not been verified.", "Après une forte pluie, une personne constate une bouche d’égout obstruée et de l’eau près d’un trottoir. Un autre message parle d’une urgence grave, sans confirmation."], "question": ["Which response is proportionate and helpful?", "Quelle réaction est proportionnée et utile ?"], "source": "311", "options": [{"t": ["Keep away from unsafe water, report the location and severity through the right City channel; use emergency services if there is immediate danger.", "Évitez les eaux dangereuses, signalez le lieu et la gravité par le canal municipal approprié; utilisez les services d’urgence en cas de danger immédiat."], "why": ["Different hazards need different response channels. 3-1-1 handles municipal service reports; immediate threats call for emergency help.", "Les risques n’exigent pas tous le même canal. Le 3-1-1 traite les signalements municipaux; un danger immédiat nécessite les services d’urgence."], "points": 20, "delta": [5, 5, 6], "tag": "evidence"}, {"t": ["Take a safe photo and discuss it in a neighbourhood group, but make no service report.", "Prenez une photo sans vous mettre en danger et discutez-en dans un groupe local, sans faire de signalement."], "why": ["Community awareness can help, yet the City may not receive enough actionable information to dispatch or assess the problem.", "Sensibiliser les voisins peut aider, mais la Ville risque de manquer d’informations pour évaluer ou traiter la situation."], "points": 10, "delta": [1, 2, 0], "tag": "partial"}, {"t": ["Walk into flowing water to clear the drain yourself and tell neighbours the problem is solved.", "Entrez dans l’eau qui s’écoule pour déboucher vous-même l’avaloir et annoncez que tout est réglé."], "why": ["Entering floodwater can be hazardous. Avoid unsafe intervention; report the issue and use the appropriate response channel.", "S’aventurer dans une eau de ruissellement peut être dangereux. Évitez les interventions risquées et signalez le problème."], "points": 0, "delta": [-8, -5, -8], "tag": "safety"}], "voice": ["“The sidewalk is becoming hard to use. Who can act today?” — fictional resident", "« Le trottoir devient difficile à utiliser. Qui peut intervenir aujourd’hui ? » — témoignage fictif"]}, {"id": "r5", "title": ["Did anyone hear us?", "Nous a-t-on entendus ?"], "body": ["A consultation ends. Some people claim nothing changed; others expect every request to be adopted. The City’s engagement framework distinguishes receiving input from promising a particular decision.", "Une consultation se termine. Certaines personnes pensent que rien n’a changé; d’autres attendent l’adoption de chaque demande. Le cadre municipal distingue écoute et promesse de résultat."], "question": ["How do you keep the relationship constructive?", "Comment préserver une relation constructive ?"], "source": "ENG", "options": [{"t": ["Ask for a plain-language ‘what we heard / what happens next’ update, share it with neighbours and monitor future opportunities.", "Demandez un bilan clair « ce que nous avons entendu / prochaines étapes », partagez-le et suivez les possibilités de participation."], "why": ["Closing the feedback loop is fundamental: participants should understand what informed a decision, what did not and why.", "Boucler la rétroaction est essentiel : chacun doit comprendre ce qui a influencé la décision, ce qui n’a pas été retenu et pourquoi."], "points": 20, "delta": [5, 5, 7], "tag": "follow"}, {"t": ["Wait for a decision and assume people can find the outcome themselves.", "Attendez une décision en supposant que tout le monde pourra trouver le résultat."], "why": ["A passive approach misses residents who are not constantly online. Proactive, accessible follow-up improves trust.", "Une approche passive laisse de côté les personnes peu connectées. Un suivi accessible et proactif renforce la confiance."], "points": 10, "delta": [0, 1, 0], "tag": "partial"}, {"t": ["Claim that a councillor promised to implement every suggestion.", "Affirmez qu’un membre du Conseil a promis de mettre en œuvre toutes les suggestions."], "why": ["Engagement does not guarantee adoption of every suggestion. Unverified promises create false expectations about staff and Council decisions.", "Une consultation ne garantit pas l’adoption de toute proposition. Les promesses non vérifiées créent de fausses attentes."], "points": 0, "delta": [-7, -4, -9], "tag": "claim"}], "voice": ["“Even if our idea wasn’t selected, we want to know why.” — fictional participant", "« Même si notre idée n’a pas été retenue, nous voulons savoir pourquoi. » — personne fictive"]}], "office": [{"id": "o1", "title": ["Three requests, one morning", "Trois demandes, un matin"], "body": ["The ward inbox receives a dangerous crossing concern, a missed waste collection, and an unverified allegation about development. Staff capacity is limited.", "Le bureau reçoit un signalement de traversée dangereuse, une collecte de déchets manquée et une allégation non vérifiée sur un projet immobilier. L’équipe manque de temps."], "question": ["How should the office triage the messages?", "Comment prioriser les messages ?"], "source": "311", "options": [{"t": ["Flag immediate safety risk for the proper urgent channel, route routine service items to 3-1-1, and log the planning question for verification.", "Orientez le risque immédiat vers le bon canal d’urgence, la demande courante vers le 3-1-1 et consignez la question d’urbanisme à vérifier."], "why": ["This separates urgency, service delivery and policy inquiry. A councillor’s office can coordinate and follow up without replacing City operations.", "Cela distingue urgence, prestation de service et question de politique. Le bureau peut coordonner le suivi sans remplacer les services municipaux."], "points": 20, "delta": [5, 7, 6], "tag": ""}, {"t": ["Reply to all three with the same general contact information.", "Répondez aux trois messages avec les mêmes coordonnées générales."], "why": ["A uniform acknowledgement helps, but urgent and time-sensitive issues require more specific triage.", "Un accusé de réception uniforme est utile, mais les situations urgentes nécessitent un tri plus précis."], "points": 10, "delta": [1, 0, 1], "tag": ""}, {"t": ["Promise that the councillor will personally fix all three issues by tomorrow.", "Promettez que le conseiller règlera personnellement les trois problèmes d’ici demain."], "why": ["That overstates authority and capacity. Good case management records the issue, the responsible service and realistic next steps.", "Cette promesse surestime les pouvoirs et les moyens. Un bon suivi identifie le problème, le service responsable et les étapes réalistes."], "points": 0, "delta": [-7, -5, -8], "tag": ""}], "voice": ["“A fast reply is good; a useful reply is better.” — fictional office colleague", "« Répondre vite, c’est bien; répondre utilement, c’est mieux. » — collègue fictif"]}, {"id": "o2", "title": ["A consultation at the Walter Baker area", "Une rencontre près du centre Walter Baker"], "body": ["The office wants to hear from residents about changes in streets and public spaces. Some work shifts, some need French, others cannot attend a crowded evening event.", "Le bureau souhaite recueillir des avis sur les rues et espaces publics. Certaines personnes travaillent de soir, d’autres souhaitent le français ou ne peuvent participer à une rencontre bondée."], "question": ["Choose the outreach strategy.", "Choisissez la stratégie de mobilisation."], "source": "ENG", "options": [{"t": ["Offer bilingual notices, an accessible in-person option, online input and a plain-language summary of what decisions are open.", "Offrez des avis bilingues, une rencontre accessible, une participation en ligne et un résumé clair des décisions encore ouvertes."], "why": ["Multiple formats and clarity on the scope of influence align with Ottawa’s engagement, accessibility and bilingual-service principles.", "Plusieurs formats et la clarté sur les marges d’influence respectent les principes municipaux de participation, d’accessibilité et de bilinguisme."], "points": 20, "delta": [8, 4, 5], "tag": ""}, {"t": ["Hold one evening meeting and promise to upload slides later.", "Organisez une seule réunion en soirée en promettant de publier les diapositives."], "why": ["Some residents will be heard, but others face timing, language or access barriers. A complementary channel is needed.", "Certaines personnes pourront participer, d’autres rencontreront des obstacles d’horaire, de langue ou d’accessibilité. Un autre canal est utile."], "points": 10, "delta": [0, 1, 1], "tag": ""}, {"t": ["Invite only the most active neighbourhood group because it is easy to reach.", "Invitez uniquement le groupe de quartier le plus actif parce qu’il est facile à joindre."], "why": ["Convenience is not representative engagement. Unheard groups can have materially different accessibility and travel needs.", "La facilité ne garantit pas la représentativité. Les groupes non consultés peuvent avoir des besoins différents."], "points": 0, "delta": [-9, -5, -7], "tag": ""}], "voice": ["“Please don’t make us choose between childcare and being heard.” — fictional parent", "« Ne nous obligez pas à choisir entre garder les enfants et participer. » — parent fictif"]}, {"id": "o3", "title": ["Development questions and limits of power", "Urbanisme : questions et limites des pouvoirs"], "body": ["Emails about a fictional project echo real Ward 24 discussions: traffic, parking, private wells and stormwater. Residents ask the office to guarantee a particular planning outcome.", "Des courriels sur un projet fictif reprennent des questions déjà discutées dans le quartier 24 : circulation, stationnement, puits privés et eaux pluviales. Des résidents demandent une garantie de résultat."], "question": ["What can the office responsibly communicate?", "Que peut communiquer le bureau de façon responsable ?"], "source": "NEWS", "options": [{"t": ["Explain review stages and jurisdiction, seek staff advice on lawful options, and publish questions and technical responses without pre-judging the decision.", "Expliquez les étapes et les compétences, sollicitez l’avis des services sur les options légales et publiez les questions et réponses techniques sans préjuger de la décision."], "why": ["Planning outcomes depend on statutory rules and evidence. Transparent explanation respects residents without suggesting that one elected official controls every step.", "Les décisions d’urbanisme dépendent du droit et des preuves. La transparence respecte les résidents sans laisser croire qu’un élu contrôle tout."], "points": 20, "delta": [4, 7, 6], "tag": ""}, {"t": ["Say the office is listening but give no timeline, process or resource links.", "Dites que le bureau écoute, sans donner de calendrier, d’étapes ni de liens utiles."], "why": ["Empathy is a start; procedural clarity and follow-up are what make it useful.", "L’écoute est un début; la clarté des procédures et le suivi lui donnent sa valeur."], "points": 10, "delta": [1, 0, 0], "tag": ""}, {"t": ["Promise to block or approve the plan before any review.", "Promettez de bloquer ou d’approuver le projet avant l’examen."], "why": ["Such a promise misrepresents planning procedures and can undermine perceived fairness. Clarify roles and disclose limits.", "Cette promesse déforme la procédure et peut compromettre la perception d’équité. Précisez les rôles et les limites."], "points": 0, "delta": [-6, -8, -8], "tag": ""}], "voice": ["“We’re asking for an explanation—not a guarantee.” — fictional neighbour", "« Nous demandons une explication, pas une garantie. » — voisin fictif"]}, {"id": "o4", "title": ["A resident forwards private information", "Un résident transmet des renseignements privés"], "body": ["A resident emails photos and personal contact details about a dispute over surface drainage and asks that everything be posted publicly for accountability.", "Un résident envoie des photos et des coordonnées personnelles au sujet d’un désaccord de drainage et demande une publication intégrale au nom de la transparence."], "question": ["How should the office handle the material?", "Comment traiter les renseignements ?"], "source": "PRIV", "options": [{"t": ["Record only what is needed, route the issue to the responsible service, protect identifying data and explain what can be shared publicly.", "Conservez uniquement l’essentiel, orientez le dossier, protégez les données identifiantes et expliquez ce qui peut être rendu public."], "why": ["Accountability and privacy both matter. Municipal institutions have duties under MFIPPA, and a public update need not reveal personal correspondence.", "La responsabilité et la vie privée vont de pair. Les institutions municipales ont des obligations sous la loi ontarienne; un bilan public n’exige pas la publication de courriels personnels."], "points": 20, "delta": [6, 4, 7], "tag": ""}, {"t": ["Acknowledge the email and leave the full attachment in a widely shared team folder.", "Accusez réception et laissez la pièce jointe complète dans un dossier partagé largement."], "why": ["Unnecessary access increases risk. Restrict access and handle sensitive information according to authorized processes.", "Un accès inutile augmente les risques. Limitez-le et utilisez les procédures autorisées."], "points": 10, "delta": [0, 0, 0], "tag": ""}, {"t": ["Publish the whole email and photos to prove the office is transparent.", "Publiez l’intégralité du courriel et des photos pour prouver la transparence du bureau."], "why": ["Disclosure of personal information can create harm. Transparency requires a careful public summary, not indiscriminate release.", "La diffusion de données personnelles peut nuire. La transparence consiste à résumer les faits publics avec précaution."], "points": 0, "delta": [-8, -6, -9], "tag": ""}], "voice": ["“I wanted help, not my address on a public page.” — fictional resident", "« Je voulais de l’aide, pas mon adresse sur une page publique. » — résident fictif"]}, {"id": "o5", "title": ["The weekly update", "Le bulletin hebdomadaire"], "body": ["The office must update residents about a bus stop, a planning file and a drainage request. Some outcomes are pending and another agency makes part of the decision.", "Le bureau doit informer les résidents d’un arrêt d’autobus, d’un dossier d’urbanisme et d’un problème de drainage. Certains résultats sont en attente et une autre organisation décide d’un volet."], "question": ["Which update improves trust?", "Quel bilan favorise la confiance ?"], "source": "ENG", "options": [{"t": ["Use a bilingual, accessible ‘issue / responsible body / status / next update’ format, acknowledge uncertainty and invite corrections.", "Présentez un bilan bilingue accessible « enjeu / organisme responsable / état / prochain suivi », reconnaissez les incertitudes et invitez les corrections."], "why": ["This makes the engagement cycle visible. A clear status report allows residents to assess what was heard without implying promises.", "Cela rend le cycle de participation visible. Un bilan clair permet de voir le suivi sans sous-entendre de promesses."], "points": 20, "delta": [5, 5, 8], "tag": ""}, {"t": ["Post a brief success story mentioning only completed work.", "Publiez une bonne nouvelle qui ne mentionne que les dossiers terminés."], "why": ["Celebrating outcomes is fine, but residents also need honest updates on pending and unresolved work.", "Valoriser les réalisations est utile, mais les dossiers en attente méritent aussi un suivi honnête."], "points": 10, "delta": [0, 1, 1], "tag": ""}, {"t": ["Describe unfinished requests as solved because it looks efficient.", "Présentez les dossiers non réglés comme terminés pour montrer de l’efficacité."], "why": ["Misstating the status erodes trust. Report what is known, unknown and who is responsible for the next action.", "Annoncer à tort un dossier comme résolu mine la confiance. Indiquez les faits, les incertitudes et la prochaine responsabilité."], "points": 0, "delta": [-7, -5, -10], "tag": ""}], "voice": ["“We can accept a delay if you tell us what happens next.” — fictional resident", "« Nous pouvons accepter un délai si nous savons ce qui suit. » — résident fictif"]}], "staff": [{"id": "s1", "title": ["Start with the right problem", "Définir le bon problème"], "body": ["You are drafting options for a fictional Barrhaven East mobility improvement. Residents describe long waits and difficult crossings; mobility dashboards offer only citywide trend samples.", "Vous préparez des options pour une amélioration fictive des déplacements à Barrhaven-Est. Les résidents décrivent de longues attentes et des traversées difficiles; le tableau de bord ne donne que des tendances échantillonnées."], "question": ["How do you establish the baseline?", "Comment établir la situation de départ ?"], "source": "MOB", "options": [{"t": ["Combine location-specific field checks, accessibility observations, available datasets and resident accounts; explain sampling limits.", "Combinez des observations sur place, des vérifications d’accessibilité, les données disponibles et les témoignages; expliquez les limites des échantillons."], "why": ["Technical assessment and lived experience complement each other. The public mobility dashboard itself warns against treating trend indicators as real-time route facts.", "L’expertise technique et l’expérience vécue sont complémentaires. Le tableau de bord avertit que les tendances ne constituent pas des temps de parcours en temps réel."], "points": 20, "delta": [5, 8, 4], "tag": ""}, {"t": ["Use the dashboard alone as the baseline because it is official.", "Utilisez uniquement le tableau de bord parce qu’il est officiel."], "why": ["Official information is valuable but it covers selected locations and periods; local context remains essential.", "Les données officielles sont précieuses, mais concernent des lieux et périodes choisis; le contexte local reste essentiel."], "points": 10, "delta": [0, 3, 1], "tag": ""}, {"t": ["Choose a redesign before examining conditions or hearing from residents.", "Choisissez un réaménagement avant d’étudier les conditions et de consulter les résidents."], "why": ["A predetermined remedy risks wasting resources and missing access barriers. Scope the problem before choosing a solution.", "Une solution prédéterminée risque de gaspiller des ressources et d’ignorer des obstacles. Définissez d’abord le problème."], "points": 0, "delta": [-8, -9, -6], "tag": ""}], "voice": ["“Do the numbers include my accessible route?” — fictional resident", "« Les chiffres couvrent-ils mon trajet accessible ? » — personne fictive"]}, {"id": "s2", "title": ["Design the engagement, not just the survey", "Concevoir la participation, pas seulement le sondage"], "body": ["A project page is ready. Parents, people with mobility disabilities, francophones and shift workers may experience the corridor differently.", "La page du projet est prête. Parents, personnes ayant une limitation motrice, francophones et travailleurs de soir peuvent vivre différemment le même trajet."], "question": ["Which outreach design fits the City’s commitments?", "Quelle mobilisation respecte les engagements municipaux ?"], "source": "ENG", "options": [{"t": ["Define the decision scope, offer accessible English/French information, online and offline input, and describe how comments will be used.", "Définissez la marge de décision; offrez des ressources accessibles en français et en anglais, des canaux en ligne et hors ligne et expliquez l’utilisation des avis."], "why": ["The City’s 2026 engagement approach includes design, implementation, analysis and reporting back. Accessible bilingual options reduce exclusion.", "Le cadre 2026 comprend conception, mise en œuvre, analyse et rétroaction. Des options bilingues accessibles réduisent l’exclusion."], "points": 20, "delta": [9, 4, 5], "tag": ""}, {"t": ["Use a bilingual web survey without any other input channel.", "Utilisez uniquement un sondage Web bilingue."], "why": ["Bilingual text helps but does not resolve device, literacy, scheduling or disability barriers.", "Le bilinguisme aide, mais ne résout pas les obstacles technologiques, de littératie, d’horaire ou liés au handicap."], "points": 10, "delta": [2, 2, 1], "tag": ""}, {"t": ["Only invite participants who have commented on a previous City project.", "N’invitez que les personnes ayant déjà participé à un projet municipal."], "why": ["Repeat participants are not necessarily representative of those affected. Plan outreach beyond the existing list.", "Les participants habituels ne représentent pas forcément toutes les personnes concernées. Élargissez la mobilisation."], "points": 0, "delta": [-9, -4, -6], "tag": ""}], "voice": ["“A city service must be usable by more than regular survey-takers.” — fictional accessibility advisor", "« Un service municipal doit être utilisable au-delà des habitués des sondages. » — conseillère fictive"]}, {"id": "s3", "title": ["Growth, water and traffic", "Croissance, eau et circulation"], "body": ["A fictional planning file raises questions about parking, groundwater, road safety and stormwater. The ward’s November newsletter documented real questions on similar topics at 3400 Woodroffe Avenue.", "Un dossier fictif soulève des questions sur le stationnement, la nappe phréatique, la sécurité et le drainage. Le bulletin du quartier de novembre documentait des questions semblables au 3400, avenue Woodroffe."], "question": ["What goes into the briefing?", "Que doit contenir la note d’information ?"], "source": "NEWS", "options": [{"t": ["Describe the relevant planning framework, disclose technical studies and uncertainties, separate legal constraints from possible mitigations, and summarize divergent submissions.", "Décrivez le cadre d’urbanisme, les études techniques et les incertitudes; distinguez les contraintes légales des atténuations possibles et résumez les avis divergents."], "why": ["Decision-makers need an honest record of evidence and jurisdiction. A briefing should neither predetermine a vote nor conceal concerns.", "Les décideurs ont besoin d’un dossier transparent et de connaître les compétences. La note ne doit ni prédéterminer un vote ni masquer les inquiétudes."], "points": 20, "delta": [5, 9, 6], "tag": ""}, {"t": ["List requested mitigations but omit what legislation allows.", "Énumérez les mesures souhaitées sans expliquer ce que permet la loi."], "why": ["The requests are useful, but feasibility and jurisdiction are essential to avoid misleading expectations.", "Les demandes sont utiles, mais les limites légales et la faisabilité doivent être expliquées."], "points": 10, "delta": [0, 2, 0], "tag": ""}, {"t": ["Exclude concerns from residents who oppose the proposal.", "Écartez les préoccupations des personnes opposées au projet."], "why": ["Filtering evidence based on position compromises the fairness of the process. Record different views and assess their substance.", "Filtrer selon la position compromet l’équité. Consignez les points de vue et examinez leur contenu."], "points": 0, "delta": [-8, -8, -8], "tag": ""}], "voice": ["“Tell us what the City can change and what it cannot.” — fictional participant", "« Expliquez ce que la Ville peut modifier et ce qu’elle ne peut pas. » — participant fictif"]}, {"id": "s4", "title": ["An incident tests the service", "Un incident met le service à l’épreuve"], "body": ["During a fictional stormwater response, residents submit photos, private addresses and descriptions of a potentially unsafe area. The team wants to publish an incident map.", "Lors d’un épisode fictif de ruissellement, des résidents transmettent photos, adresses privées et détails sur une zone potentiellement dangereuse. L’équipe veut publier une carte des incidents."], "question": ["How should information be handled?", "Comment traiter les renseignements ?"], "source": "PRIV", "options": [{"t": ["Safely triage urgent hazards, restrict identifying details, aggregate public reporting where appropriate, and share a clear accessible status update.", "Évaluez les dangers urgents, limitez les données identifiantes, regroupez l’information publique au besoin et publiez un état clair et accessible."], "why": ["Service response, privacy and public communication have distinct needs. MFIPPA constrains municipal personal-information handling.", "Intervention, vie privée et communication publique ont des exigences distinctes. La loi ontarienne encadre les renseignements personnels municipaux."], "points": 20, "delta": [6, 6, 7], "tag": ""}, {"t": ["Keep detailed reports in a single shared spreadsheet open to every project participant.", "Conservez les rapports détaillés dans un tableau accessible à toute l’équipe élargie."], "why": ["Coordination matters, but unnecessary access to personal data is a risk; use authorization and minimization.", "La coordination compte, mais un accès excessif aux données crée un risque; limitez l’accès aux personnes autorisées."], "points": 10, "delta": [0, 1, 0], "tag": ""}, {"t": ["Publish names and addresses on an interactive public map.", "Publiez noms et adresses sur une carte publique interactive."], "why": ["That would expose personal information unnecessarily. Public transparency can use aggregated locations and status categories.", "Cela exposerait inutilement des données personnelles. On peut informer le public avec des lieux agrégés et des catégories d’état."], "points": 0, "delta": [-9, -7, -9], "tag": ""}], "voice": ["“The public needs a status—not the names of households who reported.” — fictional privacy advisor", "« Le public a besoin d’un état du dossier, pas du nom des ménages qui signalent. » — conseillère fictive"]}, {"id": "s5", "title": ["Present options without a predetermined outcome", "Présenter des options sans résultat prédéfini"], "body": ["Your team must explain findings to residents and decision-makers. Resources are finite and multiple interventions are technically possible.", "Votre équipe doit expliquer ses constats aux résidents et aux décideurs. Les ressources sont limitées et plusieurs interventions sont possibles."], "question": ["What makes the final briefing credible?", "Qu’est-ce qui rend la note finale crédible ?"], "source": "ENG", "options": [{"t": ["Present options, evidence, costs and access impacts; summarize what was heard, what changed and who will decide next.", "Présentez options, preuves, coûts et effets sur l’accès; résumez les avis recueillis, les changements et la prochaine instance décisionnelle."], "why": ["This supports informed democratic oversight and clear accountability, independent of which policy option is ultimately chosen.", "Cela soutient le contrôle démocratique éclairé et la responsabilité, quel que soit le choix final de politique."], "points": 20, "delta": [6, 7, 8], "tag": ""}, {"t": ["Present the technically preferred option without a clear account of community feedback.", "Présentez l’option technique privilégiée sans expliquer clairement les avis de la communauté."], "why": ["Technical conclusions are valuable, but the report should show how public input was considered and where uncertainties remain.", "Une conclusion technique est utile, mais le rapport doit montrer comment les contributions ont été prises en compte."], "points": 10, "delta": [0, 3, 1], "tag": ""}, {"t": ["Make the less popular option disappear from the record so the report appears unanimous.", "Supprimez l’option moins populaire afin de présenter un rapport unanime."], "why": ["Removing viable alternatives or dissent obscures trade-offs and weakens trust. Be transparent about the limits of consensus.", "Supprimer des options ou des divergences masque les compromis et nuit à la confiance. Expliquez les limites du consensus."], "points": 0, "delta": [-8, -8, -9], "tag": ""}], "voice": ["“We should be able to understand the reasons, even when we disagree.” — fictional resident", "« Nous devrions comprendre les raisons, même lorsque nous ne sommes pas d’accord. » — personne fictive"]}]}}</script>

<div class="foot-strip"><p><strong>${t.how}:</strong> ${t.learn}</p><a href="https://www.ward24.ca/ward" target="_blank" rel="noopener noreferrer">Ward 24 ↗</a></div>`}
function sidebar(){const t=T();let p=s.step+(s.screen==="end"?0:0);return `<aside class="sidebar" aria-label="${esc(t.points)}"><div><div class="side-title">${t.points}</div><div class="score" aria-live="polite">${s.score}<small> / 100</small></div><div class="mini">${s.screen==="roleIntro"?(s.lang===0?"Role briefing":"Présentation du rôle"):`${t.step} ${Math.min(s.step+1,5)} ${t.of} 5`}</div><div class="track blue" aria-label="Game progress"><div style="width:${Math.min(100,s.step/5*100)}%"></div></div></div><div class="side-divider"></div><div>${[t.inclusive,t.evidence,t.clarity].map((k,i)=>`<div class="bar-label"><span>${k}</span><span>${s.metrics[i]}/100</span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.metrics[i]}" aria-label="${esc(k)}"><div style="width:${s.metrics[i]}%"></div></div>`).join("")}</div><div class="side-divider"></div><div class="mini">${t.scoreInfo}</div></aside>`}
function stage(){const t=T();const d=G.scenes[s.role][s.step];return `<div class="topline"><span class="stage">${t.step} ${s.step+1} ${t.of} 5 · ${esc(loc(G.roles[s.role].name))}</span><span class="badge blue">${t.scenario}</span></div><h1>${esc(loc(d.title))}</h1><p class="body">${esc(loc(d.body))}</p><div class="story">${esc(loc(d.voice))}</div>${s.unresolved?`<div class="next-note" role="status">⚠ ${t.carry}</div>`:""}<div class="question">${esc(loc(d.question))}</div><div class="choices">${d.options.map((x,i)=>`<button type="button" class="choice" data-choice="${i}"><span class="index">${String.fromCharCode(65+i)}</span><span>${esc(loc(x.t))}</span></button>`).join("")}</div><div class="source-inline">📚 ${t.source}: ${sourceLink(d.source)}</div>`}
function roleIntro(){const t=T(),r=G.roles[s.role];return `<span class="badge blue">🧭 ${s.lang===0?"Role briefing":"Présentation du rôle"}</span><h1>${r.icon} ${esc(loc(r.name))}</h1><p class="body">${esc(loc(r.intro))}</p><div class="story">${t.learn}</div><p class="legal">${t.notCity}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:26px"><button class="btn green" id="begin">${t.continue} →</button><button class="btn secondary" id="backHome">${t.back}</button></div>`}
function feedback(){const t=T();const d=G.scenes[s.role][s.step],o=d.options[s.pending];const type=o.points===20?"best":o.points===10?"partial":"risk";
return `<span class="badge ${type==="risk"?"amber":"blue"}">${t.step} ${s.step+1} ${t.of} 5</span><h1>${t.feedback}</h1><div class="mini">${t.selected}:</div><p class="body"><strong>${esc(loc(o.t))}</strong></p><div class="feedback-card ${type==="risk"?"risky":""}" role="status"><h3>${type==="best"?"✓":type==="partial"?"◐":"!"} ${t[type]}</h3><p>${esc(loc(o.why))}</p><div class="impact"><span>${t.earned}: +${o.points}</span><span>${t.points}: ${s.score}/100</span></div></div><div class="source-inline">📚 ${t.source}: ${sourceLink(d.source)}</div><div style="margin-top:26px"><button class="btn green" id="advance">${t.continue} →</button></div>`}
function repair(){const t=T(),d=G.scenes[s.role][s.step];return `<span class="badge amber">↪ ${t.repairTitle}</span><h1>${t.repairTitle}</h1><p class="body">${t.repairText}</p><div class="story">${esc(loc(d.voice))}</div><div class="choices"><button type="button" class="choice" data-repair="1"><span class="index">A</span>${t.fix}</button><button type="button" class="choice" data-repair="0"><span class="index">B</span>${t.ignore}</button></div><div class="source-inline">📚 ${t.source}: ${sourceLink(d.source)}</div>`}
function repairFeedback(){const t=T();return `<span class="badge blue">↪ ${t.repairTitle}</span><h1>${t.feedback}</h1><div class="feedback-card ${s.recovery?"":"risky"}"><h3>${s.recovery?t.best:t.risk}</h3><p>${s.recovery?t.fixWhy:t.ignoreWhy}</p><div class="impact"><span>${t.fixPts}: +${s.recovery?5:0}</span><span>${t.points}: ${s.score}/100</span></div></div><button class="btn green" id="advanceRepair">${t.continue} →</button>`}
function end(){const t=T();let msg=s.score===100?t.resultPerfect:s.score>=70?t.resultMid:t.resultLow;
return `<span class="badge">✓ ${t.report}</span><h1>${t.finalTitle}</h1><p class="body">${msg}</p><div class="feedback-card"><div class="side-title">${t.points}</div><div class="score">${s.score}<small> / 100</small></div><p class="legal">${t.reportText}</p></div><h2>${t.report}</h2><div class="report">${s.history.map((h,i)=>{let sc=G.scenes[s.role][i];return `<div class="report-row"><div><strong>${i+1}. ${esc(loc(sc.title))}</strong><br><span class="mini">${esc(loc(sc.options[h.choice].t))}</span>${h.repaired!==undefined?`<br><span class="mini">${h.repaired?"✓": "✕"} ${t.repairTitle}</span>`:""}</div><strong>+${h.points+(h.repaired?5:0)}</strong></div>`}).join("")}</div>
<div class="next-note"><strong>${t.next}</strong><p class="legal">${t.notCity}</p></div><div class="resources">${t.siteLinks.map(([name,info,key])=>`<a class="resource" href="${G.sources[key].url}" target="_blank" rel="noopener noreferrer"><strong>${esc(name)} ↗</strong><small>${esc(info)}</small></a>`).join("")}</div>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px"><button class="btn green" id="again">${t.tryAgain}</button><button class="btn secondary" id="print">${t.print}</button></div>`}
function render(move=false){updateChrome();let output=s.screen==="home"?home():`<div class="game-shell">${sidebar()}<section class="scene-box" aria-label="${T().scenario}">${s.screen==="roleIntro"?roleIntro():s.screen==="question"?stage():s.screen==="feedback"?feedback():s.screen==="recovery"?repair():s.screen==="recoveryFeedback"?repairFeedback():end()}</section></div>`;app.innerHTML=output;
document.querySelectorAll("[data-role]").forEach(x=>x.addEventListener("click",()=>{s.role=x.dataset.role;s.screen="roleIntro";render(true)}));
document.getElementById("jump")?.addEventListener("click",()=>document.getElementById("roles").scrollIntoView({behavior:"smooth"}));
document.getElementById("backHome")?.addEventListener("click",reset);
document.getElementById("begin")?.addEventListener("click",()=>{s.screen="question";render(true)});
document.querySelectorAll("[data-choice]").forEach(x=>x.addEventListener("click",()=>{const i=Number(x.dataset.choice);const o=G.scenes[s.role][s.step].options[i];s.score+=o.points;s.metrics=s.metrics.map((m,k)=>Math.max(0,Math.min(100,m+o.delta[k])));s.pending=i;s.history.push({choice:i,points:o.points});s.screen="feedback";s.unresolved=o.points===0;render(true)}));
document.getElementById("advance")?.addEventListener("click",()=>{const o=G.scenes[s.role][s.step].options[s.pending];if(o.points===0){s.screen="recovery"}else{advanceStep();return;}render(true)});
document.querySelectorAll("[data-repair]").forEach(x=>x.addEventListener("click",()=>{s.recovery=x.dataset.repair==="1";s.history[s.history.length-1].repaired=s.recovery;if(s.recovery){s.score+=5;s.metrics=s.metrics.map(x=>Math.min(100,x+3));s.unresolved=false;}s.screen="recoveryFeedback";render(true)}));
document.getElementById("advanceRepair")?.addEventListener("click",()=>{advanceStep()});
document.getElementById("again")?.addEventListener("click",reset);
document.getElementById("print")?.addEventListener("click",()=>window.print());
if(move)focus();
}
function advanceStep(){s.step+=1;s.pending=null;s.recovery=null;s.screen=s.step>=5?"end":"question";render(true)}
function reset(){let lang=s.lang;Object.assign(s,{lang,screen:"home",role:null,step:0,score:0,metrics:[51,53,50],pending:null,history:[],recovery:null,unresolved:false});render(true)}
document.getElementById("en").addEventListener("click",()=>{s.lang=0;render(true)});
document.getElementById("fr").addEventListener("click",()=>{s.lang=1;render(true)});
document.getElementById("restart").addEventListener("click",reset);
document.getElementById("brandHome").addEventListener("click",e=>{e.preventDefault();reset()});
render();
</script><script>
/* Learning Lab v2 layer — Barrhaven East (added 2026-11-19).
   Pure addition: the game's data and logic are untouched. Adds a casebook,
   a richer ending (badge + wish, your pattern, designed pitfalls, other
   roles' perspectives) and an on-device results history (Variant A:
   local only, honestly labelled, nothing is sent anywhere). */
(function () {
  'use strict';
  var GAME = 'barrhaven';
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById('game-data').textContent); } catch (e) { DATA = null; }
  if (!DATA) return;

  var STR = {
    en: {
      casebookBtn: 'Casebook', casebookTitle: 'Casebook — decisions, sound practice, sources',
      casebookIntro: 'Every decision in this game, the practice it teaches, and the official source behind it. Use it to prepare for a real conversation with the ward office or the City.',
      practice: 'Sound practice', source: 'Source', close: 'Close',
      badgeKicker: 'Your badge', patternTitle: 'Your decision pattern',
      patternNone: 'No risky choices this time — every decision used the strongest practice available.',
      patternRisk: 'Where the risk was:', patternPartial: 'Where a stronger option existed:',
      pitfallsTitle: 'The traps this game is built to reveal',
      pitfallsIntro: 'These are the recurring decision traps built into this simulation — the ones real processes fall into most easily:',
      pitfalls: [
        'Exposing private information — identifiable photos, names, addresses or a neighbour’s private test results.',
        'Treating a claim or a viral post as established fact before checking it.',
        'Promising outcomes beyond your authority — a fix by tomorrow, or blocking or approving a plan yourself.',
        'Hearing only the loudest, closest or easiest-to-reach voices.',
        'Deciding before examining the conditions and the evidence.',
        'Making the record look cleaner than it is — hiding dissent or calling unfinished work solved.',
        'Taking physical safety into your own hands instead of using the proper channel.'
      ],
      lensesTitle: 'Through other eyes',
      lensesIntro: 'The same ward, seen from the other roles. Playing another role is the fastest way to feel where their constraints come from:',
      historyTitle: 'Your previous results on this device',
      historyNote: 'Saved only in this browser, on this device. Nothing is sent to the City or to any server.',
      plays: 'plays', best: 'best', latest: 'latest scores',
      bands: [
        { min: 100, name: 'Civic Champion', wish: 'May every concern you raise arrive with facts — and every room you enter leave fairer than you found it.' },
        { min: 85, name: 'Trusted Facilitator', wish: 'One repair away from flawless. May your next conversation close the gap.' },
        { min: 70, name: 'Community Builder', wish: 'You are building the habits that hold a neighbourhood together. Keep going.' },
        { min: 40, name: 'Civic Apprentice', wish: 'Every expert was once a beginner who stayed in the room. Try another role and watch the same ward change shape.' },
        { min: 0, name: 'First Steps', wish: 'The first step is showing up. The casebook above shows the stronger path for every decision — the next run is yours.' }
      ]
    },
    fr: {
      casebookBtn: 'Carnet de cas', casebookTitle: 'Carnet de cas — décisions, pratique et sources',
      casebookIntro: 'Chaque décision du jeu, la pratique qu’elle enseigne et la source officielle qui la soutient. À utiliser pour préparer une vraie conversation avec le bureau de quartier ou la Ville.',
      practice: 'Pratique recommandée', source: 'Source', close: 'Fermer',
      badgeKicker: 'Votre insigne', patternTitle: 'Votre profil de décision',
      patternNone: 'Aucun choix risqué cette fois — chaque décision a suivi la pratique la plus solide.',
      patternRisk: 'Là où le risque était :', patternPartial: 'Là où une option plus solide existait :',
      pitfallsTitle: 'Les pièges que ce jeu apprend à repérer',
      pitfallsIntro: 'Voici les pièges de décision intégrés à cette simulation — ceux dans lesquels les processus réels tombent le plus facilement :',
      pitfalls: [
        'Divulguer des renseignements privés — photos identifiables, noms, adresses ou résultats privés d’un voisin.',
        'Traiter une affirmation ou une publication virale comme un fait établi avant de la vérifier.',
        'Promettre des résultats au-delà de vos pouvoirs — une réparation demain, ou bloquer ou approuver un plan soi-même.',
        'N’entendre que les voix les plus fortes, les plus proches ou les plus faciles à joindre.',
        'Décider avant d’examiner les conditions et les preuves.',
        'Présenter un dossier plus propre qu’il ne l’est — cacher un désaccord ou déclarer terminé un travail inachevé.',
        'Prendre la sécurité physique en main au lieu d’utiliser le canal approprié.'
      ],
      lensesTitle: 'Par d’autres yeux',
      lensesIntro: 'Le même quartier, vu depuis les autres rôles. Jouer un autre rôle est le moyen le plus rapide de sentir d’où viennent ses contraintes :',
      historyTitle: 'Vos résultats précédents sur cet appareil',
      historyNote: 'Enregistré uniquement dans ce navigateur, sur cet appareil. Rien n’est envoyé à la Ville ni à aucun serveur.',
      plays: 'parties', best: 'meilleur', latest: 'derniers résultats',
      bands: [
        { min: 100, name: 'Champion civique', wish: 'Que chaque préoccupation que vous soulevez s’appuie sur des faits — et que chaque salle que vous quittez soit plus juste qu’à votre arrivée.' },
        { min: 85, name: 'Facilitateur de confiance', wish: 'À une correction de la perfection. Que votre prochaine conversation comble l’écart.' },
        { min: 70, name: 'Bâtisseur communautaire', wish: 'Vous construisez les habitudes qui font tenir un quartier ensemble. Continuez.' },
        { min: 40, name: 'Apprenti civique', wish: 'Chaque expert a d’abord été un débutant resté dans la salle. Essayez un autre rôle et regardez le même quartier changer de forme.' },
        { min: 0, name: 'Premiers pas', wish: 'Le premier pas, c’est d’être présent. Le carnet de cas ci-dessus montre la voie la plus solide pour chaque décision — la prochaine partie est à vous.' }
      ]
    }
  };

  function lang() { return (document.documentElement.lang || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'; }
  function L() { return STR[lang()]; }
  function li(v) { var l = lang(); if (Array.isArray(v)) return v[l === 'fr' ? 1 : 0]; if (v && typeof v === 'object') return v[l] || v.en; return v; }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function state() { try { return Function('return typeof s!=="undefined"?s:null')(); } catch (e) { return null; } }

  /* ---------- casebook ---------- */
  var overlay = null;
  function buildCasebook() {
    var t = L(), out = ['<div class="v2-cb-head"><h2>' + esc(t.casebookTitle) + '</h2><button type="button" class="v2-btn" data-v2="close">' + esc(t.close) + '</button></div><p class="v2-cb-intro">' + esc(t.casebookIntro) + '</p>'];
    Object.keys(DATA.scenes).forEach(function (rk) {
      var role = DATA.roles[rk];
      out.push('<h3 class="v2-cb-role">' + esc(li(role.name)) + '</h3>');
      DATA.scenes[rk].forEach(function (sc, i) {
        var good = sc.options.filter(function (o) { return o.points === 20; })[0] || sc.options[0];
        var src = DATA.sources[sc.source] || {};
        out.push('<article class="v2-card"><h4>' + (i + 1) + '. ' + esc(li(sc.title)) + '</h4><p>' + esc(li(sc.body)) + '</p>' +
          '<p class="v2-practice"><strong>' + esc(t.practice) + ':</strong> ' + esc(li(good.t)) + '</p><p class="v2-why">' + esc(li(good.why)) + '</p>' +
          (src.url ? '<p class="v2-src">' + esc(t.source) + ': <a href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer">' + esc(li(src)) + '</a></p>' : '') + '</article>');
      });
    });
    return out.join('');
  }
  function openCasebook() {
    closeCasebook();
    overlay = document.createElement('div');
    overlay.className = 'v2-overlay'; overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = '<div class="v2-sheet">' + buildCasebook() + '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('[data-v2="close"]').addEventListener('click', closeCasebook);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeCasebook(); });
    var c = overlay.querySelector('[data-v2="close"]'); if (c) c.focus();
  }
  function closeCasebook() { if (overlay) { overlay.remove(); overlay = null; } }

  var cbBtn = document.createElement('button');
  cbBtn.type = 'button'; cbBtn.className = 'v2-fab'; cbBtn.addEventListener('click', openCasebook);
  document.body.appendChild(cbBtn);
  function syncFab() { var txt = '📖 ' + L().casebookBtn; if (cbBtn.textContent !== txt) cbBtn.textContent = txt; }
  syncFab();

  /* ---------- ending panel ---------- */
  var recorded = false, panelFor = null;
  function band(score) { var bs = L().bands; for (var i = 0; i < bs.length; i++) if (score >= bs[i].min) return bs[i]; return bs[bs.length - 1]; }
  function history() { try { return JSON.parse(localStorage.getItem('llab.v2.' + GAME) || '[]'); } catch (e) { return []; } }
  function record(score, role) {
    try {
      var hst = history(); hst.push({ score: score, role: role || '', ts: Date.now() });
      if (hst.length > 50) hst = hst.slice(hst.length - 50);
      localStorage.setItem('llab.v2.' + GAME, JSON.stringify(hst));
    } catch (e) {}
    try { window.parent.postMessage({ type: 'llab-result', game: GAME, score: score, role: role || '', lang: lang() }, '*'); } catch (e) {}
  }
  function patternHtml(st) {
    var t = L();
    if (!st || !st.history || !DATA.scenes[st.role]) return '';
    var risks = [], partials = [];
    st.history.forEach(function (hh, i) {
      var sc = DATA.scenes[st.role][i]; if (!sc) return;
      var opt = sc.options[hh.choice]; if (!opt) return;
      if (hh.points === 0) risks.push('<li><strong>' + esc(li(sc.title)) + '</strong> — ' + esc(li(opt.why)) + '</li>');
      else if (hh.points === 10) partials.push('<li><strong>' + esc(li(sc.title)) + '</strong> — ' + esc(li(opt.why)) + '</li>');
    });
    var out = '<h3>' + esc(t.patternTitle) + '</h3>';
    if (!risks.length && !partials.length) out += '<p>' + esc(t.patternNone) + '</p>';
    if (risks.length) out += '<p class="v2-sub">' + esc(t.patternRisk) + '</p><ul class="v2-list">' + risks.join('') + '</ul>';
    if (partials.length) out += '<p class="v2-sub">' + esc(t.patternPartial) + '</p><ul class="v2-list">' + partials.join('') + '</ul>';
    return out;
  }
  function lensesHtml(st) {
    var t = L();
    if (!st || !st.role) return '';
    var others = Object.keys(DATA.roles).filter(function (rk) { return rk !== st.role; });
    if (!others.length) return '';
    var out = '<h3>' + esc(t.lensesTitle) + '</h3><p>' + esc(t.lensesIntro) + '</p>';
    others.forEach(function (rk) {
      var r = DATA.roles[rk];
      out += '<div class="v2-lens"><strong>' + esc(li(r.name)) + '</strong> — ' + esc(li(r.subtitle)) + '<br><span>' + esc(li(r.intro)) + '</span></div>';
    });
    return out;
  }
  function historyHtml() {
    var t = L(), hst = history();
    if (!hst.length) return '';
    var best = Math.max.apply(null, hst.map(function (x) { return x.score; }));
    var last = hst.slice(-5).map(function (x) { return x.score; }).join(' · ');
    return '<h3>' + esc(t.historyTitle) + '</h3><p>' + hst.length + ' ' + esc(t.plays) + ' · ' + esc(t.best) + ': ' + best + '/100 · ' + esc(t.latest) + ': ' + last + '</p><p class="v2-note">' + esc(t.historyNote) + '</p>';
  }
  function injectPanel() {
    var st = state(); if (!st) return;
    var host = document.querySelector('.scene-box'); if (!host) return;
    if (panelFor === st && host.querySelector('.v2-panel')) return;
    var old = host.querySelector('.v2-panel'); if (old) old.remove();
    var t = L(), b = band(st.score);
    var el = document.createElement('div');
    el.className = 'v2-panel';
    el.innerHTML =
      '<div class="v2-badge"><div class="v2-badge-medal" aria-hidden="true">★</div><div><div class="v2-kicker">' + esc(t.badgeKicker) + '</div>' +
      '<div class="v2-badge-name">' + esc(b.name) + '</div><p class="v2-wish">' + esc(b.wish) + '</p></div></div>' +
      patternHtml(st) +
      '<h3>' + esc(t.pitfallsTitle) + '</h3><p>' + esc(t.pitfallsIntro) + '</p><ul class="v2-list">' + t.pitfalls.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
      lensesHtml(st) +
      '<div class="v2-hist">' + historyHtml() + '</div>' +
      '<p><button type="button" class="v2-btn" data-v2="cb">' + esc(t.casebookBtn) + '</button></p>';
    host.appendChild(el);
    el.querySelector('[data-v2="cb"]').addEventListener('click', openCasebook);
    panelFor = st;
    if (!recorded) { record(st.score, st.role); recorded = true; var hh = el.querySelector('.v2-hist'); if (hh) hh.innerHTML = historyHtml(); }
  }
  var obs = new MutationObserver(function () {
    syncFab();
    var onEnd = !!document.querySelector('#again');
    if (onEnd) injectPanel();
    else { recorded = false; panelFor = null; }
  });
  obs.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['lang'] });
})();

</script>
