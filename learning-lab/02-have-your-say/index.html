endante, non exploitée ni approuvée par la Ville d’Ottawa. Aucune réponse n’est transmise à la Ville.","scoreNote":"Le score maximal possible est de 100/100 pour chaque rôle.","myAction":"Ma prochaine action","startNote":"Un exercice interactif court et gratuit. Aucun compte ni renseignement personnel requis."}},"roles":{"resident":{"name":{"en":"Community voice","fr":"Voix citoyenne"},"short":{"en":"A resident trying to make a difference","fr":"Une personne qui veut faire entendre sa voix"},"desc":{"en":"Explore a consultation, speak up for yourself and neighbours, and learn how your input reaches a decision.","fr":"Explorez une consultation, faites entendre votre voix et découvrez comment vos commentaires éclairent une décision."},"character":{"en":"Amina · Ottawa resident","fr":"Amina · résidente d’Ottawa"},"icon":"🏡"},"staff":{"name":{"en":"Engagement lead","fr":"Responsable de la participation"},"short":{"en":"A City project team perspective","fr":"Le point de vue d’une équipe municipale"},"desc":{"en":"Design a fair engagement process, respond to barriers and disagreements, and show how comments were considered.","fr":"Concevez une consultation équitable, gérez les obstacles et les désaccords, puis expliquez comment les commentaires ont été considérés."},"character":{"en":"Alex · project engagement lead","fr":"Alex · responsable de la participation"},"icon":"🗂️"},"councillor":{"name":{"en":"Council member","fr":"Membre du Conseil"},"short":{"en":"An elected representative’s perspective","fr":"Le point de vue d’une personne élue"},"desc":{"en":"Listen to different communities, respect professional staff advice, and explain the decision-making process.","fr":"Écoutez différents groupes, respectez les conseils professionnels du personnel et clarifiez le processus décisionnel."},"character":{"en":"Councillor Morgan · fictional ward","fr":"Conseiller·ère Morgan · quartier fictif"},"icon":"🏛️"}},"game":{"resident":[{"title":{"en":"The proposal arrives","fr":"Une proposition arrive"},"story":{"en":"You see a post claiming Riverbend’s design is already decided. On the project page, you find three possible approaches—but no decision has been made. What is your next move?","fr":"Vous voyez une publication affirmant que l’aménagement de Riverbend est déjà décidé. La page du projet présente pourtant trois pistes et aucune décision finale. Que faites-vous?"},"voice":{"en":"“I want to know what can still change.” — Amina","fr":"« Je veux savoir ce qui peut encore changer. » — Amina"},"options":[{"label":{"en":"Read the project scope and ask which elements are open to influence.","fr":"Lire la portée du projet et demander quels éléments peuvent encore être modifiés."},"why":{"en":"Knowing the scope and limits of influence makes feedback more useful; Ottawa’s updated strategy stresses clarity about constraints.","fr":"Comprendre la portée et les limites de l’influence rend les commentaires plus utiles; la stratégie actualisée d’Ottawa insiste sur la clarté des contraintes."},"tier":"good","sources":["strategy","engage"]},{"label":{"en":"Share the viral post as a confirmed fact.","fr":"Partager la publication virale comme s’il s’agissait d’un fait établi."},"why":{"en":"Rumours may mislead neighbours. Compare claims with the official project information before amplifying them.","fr":"Les rumeurs peuvent induire les voisins en erreur. Vérifiez les affirmations dans les renseignements officiels avant de les diffuser."},"tier":"risk","sources":["engage"]},{"label":{"en":"Wait until a final Council vote before reading anything.","fr":"Attendre le vote final du Conseil avant de s’informer."},"why":{"en":"Late participation can miss earlier opportunities. Early and ongoing engagement is a stated priority.","fr":"Une participation tardive risque de manquer des occasions importantes. La participation précoce et continue est une priorité annoncée."},"tier":"mixed","sources":["memo"]}],"incident":{"en":"Neighbours repeat the misleading claim and stop looking for ways to participate.","fr":"Des voisins répètent l’affirmation trompeuse et ne cherchent plus comment participer."},"repair":{"en":"Correct the post with the official project link and clarify which questions remain open.","fr":"Corriger la publication avec le lien officiel et expliquer les questions encore ouvertes."},"repairBad":{"en":"Insist the rumour is true without checking the project page.","fr":"Insister sur la véracité de la rumeur sans consulter la page du projet."},"sources":["engage","strategy"]},{"title":{"en":"Choose your channel","fr":"Choisir son canal"},"story":{"en":"An older neighbour is uncomfortable online; another resident wants to respond in French. You can use Engage Ottawa, but you notice not everyone will engage digitally.","fr":"Une personne âgée n’est pas à l’aise en ligne; une autre souhaite répondre en français. Participons Ottawa est disponible, mais tout le monde ne participe pas par voie numérique."},"voice":{"en":"“I need a way to participate that works for me.” — Neighbour","fr":"« Il me faut une façon de participer qui me convient. » — Voisin·e"},"options":[{"label":{"en":"Only use an online poll and assume it represents everyone.","fr":"Utiliser uniquement un sondage en ligne et supposer qu’il représente tout le monde."},"why":{"en":"Digital-only input may exclude people who lack connectivity or accessibility supports. Online responses are not automatically representative.","fr":"Un seul canal numérique peut exclure des personnes sans connexion ou soutien adapté. Les réponses en ligne ne sont pas automatiquement représentatives."},"tier":"risk","sources":["memo","access"]},{"label":{"en":"Use Engage Ottawa and ask about French, in-person and accessible ways to contribute.","fr":"Utiliser Participons Ottawa et demander des options en français, en personne et accessibles."},"why":{"en":"A mix of channels and accessible formats makes it easier for different residents to contribute; Ottawa supports bilingual service.","fr":"Des canaux variés et des formats accessibles facilitent la participation; Ottawa soutient les services bilingues."},"tier":"good","sources":["bilingual","access","engage"]},{"label":{"en":"Send one email from your own perspective only.","fr":"Envoyer un seul courriel exprimant votre point de vue."},"why":{"en":"A direct comment can help, but neighbours may need other channels. Consider making those options visible to them.","fr":"Un commentaire direct est utile, mais les voisins peuvent avoir besoin d’autres canaux. Pensez à leur signaler ces possibilités."},"tier":"mixed","sources":["memo"]}],"incident":{"en":"Two people cannot take part in the digital-only conversation.","fr":"Deux personnes ne peuvent pas participer à la consultation uniquement numérique."},"repair":{"en":"Ask the team for an accessible channel and French-language information; invite neighbours to use their own voice.","fr":"Demander un canal accessible et des renseignements en français; encourager les voisins à s’exprimer eux-mêmes."},"repairBad":{"en":"Submit guesses on behalf of people who were never consulted.","fr":"Transmettre des suppositions au nom de personnes qui n’ont jamais été consultées."},"sources":["bilingual","access"]},{"title":{"en":"A heated community meeting","fr":"Une réunion communautaire tendue"},"story":{"en":"Some residents prefer better crossings; others worry about parking or construction disruption. The discussion becomes sharp. What will you do?","fr":"Certaines personnes privilégient de meilleures traversées; d’autres craignent la perte de stationnement ou les travaux. Le ton monte. Que faites-vous?"},"voice":{"en":"“Please don’t speak for all of us.” — Local business owner","fr":"« Ne parlez pas au nom de tout le monde. » — Commerçant·e"},"options":[{"label":{"en":"Present your priorities, note trade-offs and invite others to explain theirs.","fr":"Présenter vos priorités, reconnaître les compromis et inviter d’autres personnes à expliquer les leurs."},"why":{"en":"Good participation allows different impacts to be heard without forcing consensus or promising a predetermined outcome.","fr":"Une bonne participation permet d’entendre différents effets sans imposer un consensus ni promettre un résultat fixé d’avance."},"tier":"good","sources":["strategy"]},{"label":{"en":"Collect only the comments agreeing with your view.","fr":"Recueillir uniquement les commentaires favorables à votre opinion."},"why":{"en":"Selective evidence gives an incomplete picture. The purpose is to surface perspectives and evidence, not silence disagreement.","fr":"Des témoignages sélectionnés donnent une image incomplète. L’objectif est de recueillir des perspectives et des faits, non de faire taire le désaccord."},"tier":"risk","sources":["memo"]},{"label":{"en":"Leave the discussion and participate later with a written comment.","fr":"Quitter la discussion et transmettre plus tard un commentaire écrit."},"why":{"en":"Written input remains useful; participating without confrontation can be constructive. You may miss clarifying questions, however.","fr":"Un commentaire écrit demeure utile; éviter la confrontation peut être constructif. Vous risquez toutefois de manquer des précisions."},"tier":"mixed","sources":["engage"]}],"incident":{"en":"Organizers receive a one-sided packet labelled 'the whole neighbourhood'.","fr":"Les organisateurs reçoivent un dossier unilatéral présenté comme « l’opinion du quartier entier »."},"repair":{"en":"Relabel the packet accurately and invite unrepresented perspectives.","fr":"Corriger l’étiquette du dossier et inviter les perspectives non représentées."},"repairBad":{"en":"Leave the misleading description unchanged.","fr":"Laisser la description trompeuse telle quelle."},"sources":["memo","strategy"]},{"title":{"en":"The agenda is published","fr":"L’ordre du jour est publié"},"story":{"en":"The related item appears on a standing committee agenda. You would like to speak. A friend says you can simply deliver a five-minute delegation at the City Council meeting.","fr":"Le point apparaît à l’ordre du jour d’un comité permanent. Vous souhaitez prendre la parole. Un ami dit qu’il suffit de faire une délégation de cinq minutes à la séance du Conseil."},"voice":{"en":"“Where can my comments actually be heard?” — Amina","fr":"« Où mes commentaires peuvent-ils être entendus? » — Amina"},"options":[{"label":{"en":"Wait until Council and plan a public delegation there.","fr":"Attendre la réunion du Conseil pour faire une délégation publique."},"why":{"en":"Ottawa generally permits public delegations at committee meetings, not at ordinary City Council meetings.","fr":"À Ottawa, les délégations publiques ont généralement lieu en comité, non lors des séances ordinaires du Conseil."},"tier":"risk","sources":["meet","procedure"]},{"label":{"en":"Register with the committee coordinator to speak, or submit written comments by the published deadline.","fr":"S’inscrire auprès de la coordination du comité pour parler, ou envoyer des commentaires écrits avant la date limite publiée."},"why":{"en":"This follows Ottawa’s participation guidance: committee delegations are generally up to five minutes; written submissions have posted deadlines.","fr":"Cela suit les règles de participation : les interventions en comité durent généralement jusqu’à cinq minutes et les mémoires écrits ont des échéances publiées."},"tier":"good","sources":["meet","procedure"]},{"label":{"en":"Send a written comment to the coordinator even if you cannot speak.","fr":"Envoyer un commentaire écrit à la coordination, même sans prendre la parole."},"why":{"en":"A valid route for input, though checking deadlines and meeting materials will help you make it timely.","fr":"C’est une voie de participation valable; vérifier les échéances et documents aidera à intervenir au bon moment."},"tier":"mixed","sources":["meet"]}],"incident":{"en":"You discover ordinary public delegations are not accepted during the Council meeting.","fr":"Vous apprenez que les délégations publiques ordinaires ne sont pas reçues en séance du Conseil."},"repair":{"en":"Check the committee agenda and register with the committee coordinator, or send written input.","fr":"Consulter l’ordre du jour du comité et vous inscrire, ou transmettre des commentaires écrits."},"repairBad":{"en":"Show up at Council insisting the rules must be different.","fr":"Vous présenter au Conseil en insistant pour que les règles soient différentes."},"sources":["meet","procedure"]},{"title":{"en":"After the decision","fr":"Après la décision"},"story":{"en":"The City posts a summary of consultation themes and a decision note. Your preferred design was not chosen, but some accessibility changes were incorporated.","fr":"La Ville affiche les thèmes soulevés et une note de décision. Votre option préférée n’a pas été retenue, mais certaines modifications d’accessibilité ont été intégrées."},"voice":{"en":"“Did anyone actually listen?” — Neighbour","fr":"« Est-ce que quelqu’un nous a vraiment écoutés? » — Voisin·e"},"options":[{"label":{"en":"Claim the consultation was a binding vote that was ignored.","fr":"Affirmer que la consultation était un vote contraignant qui a été ignoré."},"why":{"en":"Engagement does not automatically constitute a referendum. Compare the published scope, decision rationale and feedback report.","fr":"La participation publique n’est pas automatiquement un référendum. Comparez la portée annoncée, les motifs et le compte rendu."},"tier":"risk","sources":["engage","learned"]},{"label":{"en":"Read the report, identify where feedback was reflected and ask a specific follow-up question.","fr":"Lire le rapport, repérer où les commentaires ont été pris en compte et poser une question précise."},"why":{"en":"Reporting back is central to Ottawa’s refreshed strategy. Feedback may inform a decision without dictating a single outcome.","fr":"Le compte rendu est au cœur de la stratégie actualisée. Les commentaires peuvent éclairer une décision sans imposer un résultat unique."},"tier":"good","sources":["memo","learned"]},{"label":{"en":"Save the report but do not follow up.","fr":"Conserver le rapport sans faire de suivi."},"why":{"en":"Following the record builds understanding; a precise follow-up can clarify which trade-offs were considered.","fr":"Consulter le dossier aide à comprendre; une question précise peut éclairer les compromis étudiés."},"tier":"mixed","sources":["learned"]}],"incident":{"en":"Neighbours assume no feedback was considered because the final choice differs from the loudest comments.","fr":"Des voisins supposent qu’aucun avis n’a compté parce que l’option retenue diffère des commentaires les plus visibles."},"repair":{"en":"Explain the difference between consultation and decision, using the published report.","fr":"Expliquer la différence entre consultation et décision à l’aide du rapport publié."},"repairBad":{"en":"Present the poll results as a legally binding election.","fr":"Présenter les résultats d’un sondage comme une élection juridiquement contraignante."},"sources":["learned","engage"]}],"staff":[{"title":{"en":"Set the rules before asking","fr":"Fixer les règles avant de consulter"},"story":{"en":"Riverbend has a fixed safety requirement and a limited demonstration budget. Some details are flexible. Your project sponsor wants a quick online poll without a scope statement.","fr":"Riverbend doit respecter une exigence de sécurité et un budget pilote limité. Certains détails sont flexibles. La direction souhaite un sondage rapide sans préciser la portée."},"voice":{"en":"“What could residents actually influence?” — Project analyst","fr":"« Sur quoi les résidents peuvent-ils réellement influer? » — Analyste"},"options":[{"label":{"en":"Publish a poll labelled 'You decide everything'.","fr":"Publier un sondage intitulé « Vous décidez de tout »."},"why":{"en":"That overstates public influence. Ottawa’s Protocol considers scope, constraints and the appropriate engagement level.","fr":"Cela exagère l’influence du public. Le protocole d’Ottawa tient compte de la portée, des contraintes et du niveau de participation approprié."},"tier":"risk","sources":["engage","memo"]},{"label":{"en":"Define decisions, constraints, audiences, decision authority and engagement level first.","fr":"Définir d’abord les décisions, contraintes, publics, responsabilités et niveau de participation."},"why":{"en":"This follows the Protocol and the 2026 workbook’s planning phase, including the spectrum of engagement.","fr":"Cela suit le protocole et la préparation décrite dans le cahier 2026, notamment le spectre de participation."},"tier":"good","sources":["memo","engage"]},{"label":{"en":"Use a survey, but note the budget limit in a footer.","fr":"Faire un sondage, mais mentionner le budget en bas de page."},"why":{"en":"Some context is provided, but participants still need a clear statement of what can and cannot change.","fr":"Un contexte est donné, mais il faut encore expliquer clairement ce qui peut ou ne peut pas changer."},"tier":"mixed","sources":["strategy"]}],"incident":{"en":"The project team cannot explain which poll results will influence the plan.","fr":"L’équipe ne peut pas expliquer quels résultats du sondage éclaireront le plan."},"repair":{"en":"Pause publication and add a plain-language scope, constraints and decision path.","fr":"Suspendre la publication et ajouter la portée, les limites et le parcours décisionnel en langage clair."},"repairBad":{"en":"Keep the ambiguous wording to increase response counts.","fr":"Conserver la formulation ambiguë pour obtenir davantage de réponses."},"sources":["engage","memo"]},{"title":{"en":"Reach beyond the usual participants","fr":"Joindre plus que les habitués"},"story":{"en":"Engage Ottawa is ready, but an accessibility advisor notes screen-reader barriers in a draft attachment. Community partners say some residents cannot attend a weekday online meeting.","fr":"Participons Ottawa est prêt, mais une personne-conseil en accessibilité signale des obstacles dans une annexe. Des partenaires disent que des résidents ne peuvent assister à une réunion en ligne en semaine."},"voice":{"en":"“A survey link is not an accessibility plan.” — Accessibility advisor","fr":"« Un lien de sondage ne remplace pas un plan d’accessibilité. » — Conseiller·ère"},"options":[{"label":{"en":"Launch only the online survey this week and fix access problems later.","fr":"Lancer uniquement le sondage en ligne cette semaine, puis corriger les obstacles plus tard."},"why":{"en":"This risks excluding residents. Ottawa’s strategy and Accessibility Policy emphasize inclusive and accessible communication.","fr":"Cela risque d’exclure des résidents. La stratégie et la politique d’accessibilité d’Ottawa insistent sur une communication inclusive."},"tier":"risk","sources":["access","memo"]},{"label":{"en":"Offer EN/FR content, accessible documents, in-person options and assistance to participate.","fr":"Offrir du contenu EN/FR, des documents accessibles, des options en personne et de l’aide."},"why":{"en":"This reflects bilingual service, accessibility and the mix of digital and non-digital methods in Ottawa’s updated approach.","fr":"Cela reflète le bilinguisme, l’accessibilité et l’utilisation de canaux numériques et non numériques dans l’approche actualisée."},"tier":"good","sources":["bilingual","access","memo"]},{"label":{"en":"Translate the survey but keep the inaccessible attachment.","fr":"Traduire le sondage mais garder l’annexe inaccessible."},"why":{"en":"Translation helps language access, but it does not remove disability-related barriers.","fr":"La traduction facilite l’accès linguistique, sans éliminer les obstacles liés au handicap."},"tier":"mixed","sources":["access","bilingual"]}],"incident":{"en":"An invited community member cannot access the information needed to answer.","fr":"Une personne invitée ne peut pas consulter les renseignements nécessaires pour répondre."},"repair":{"en":"Provide the material in an accessible format and offer a supported alternative channel.","fr":"Fournir un format accessible et un autre canal accompagné."},"repairBad":{"en":"Count non-responses as support for the draft plan.","fr":"Compter les non-réponses comme un appui au projet."},"sources":["access","bilingual"]},{"title":{"en":"Strong opinions and uneven turnout","fr":"Opinions vives et participation inégale"},"story":{"en":"Responses come in from homeowners, transit riders, small businesses, youth and people with disabilities. A viral post drives many similar responses in one day.","fr":"Des réponses arrivent de propriétaires, usagers du transport en commun, commerces, jeunes et personnes handicapées. Une publication virale attire beaucoup de réponses similaires en une journée."},"voice":{"en":"“Please separate themes from a popularity contest.” — Data analyst","fr":"« Distinguez les thèmes d’un concours de popularité. » — Analyste des données"},"options":[{"label":{"en":"Treat the largest online count as representative of all Ottawa residents.","fr":"Traiter le plus grand nombre de réponses en ligne comme représentatif de toute la population d’Ottawa."},"why":{"en":"Self-selected engagement is not necessarily a statistically representative sample; report participation limits and themes clearly.","fr":"Une participation volontaire n’est pas nécessairement un échantillon représentatif; il faut signaler les limites et les thèmes."},"tier":"risk","sources":["memo","strategy"]},{"label":{"en":"Report themes, differences, methods, gaps and the limitations of the sample.","fr":"Présenter les thèmes, divergences, méthodes, lacunes et limites de l’échantillon."},"why":{"en":"Transparent analysis makes evidence usable without pretending one channel speaks for everyone.","fr":"Une analyse transparente rend les données utiles sans prétendre qu’un seul canal parle au nom de tous."},"tier":"good","sources":["memo","learned"]},{"label":{"en":"Create a simple word cloud and leave out other forms of input.","fr":"Créer un nuage de mots sans intégrer les autres contributions."},"why":{"en":"A visualization is accessible only when paired with explanation and complete analysis; it cannot replace the evidence base.","fr":"Une visualisation exige des explications et une analyse complète; elle ne remplace pas l’ensemble des preuves."},"tier":"mixed","sources":["memo"]}],"incident":{"en":"A councillor asks why one online group appears to stand for all residents.","fr":"Un membre du Conseil demande pourquoi un groupe en ligne semble représenter tous les résidents."},"repair":{"en":"Add a methods note, document underrepresented groups and distinguish themes from vote totals.","fr":"Ajouter une note méthodologique, relever les groupes moins présents et distinguer les thèmes des votes."},"repairBad":{"en":"Remove the limitations to make the chart more convincing.","fr":"Supprimer les limites pour rendre le graphique plus convaincant."},"sources":["memo","learned"]},{"title":{"en":"The report goes to committee","fr":"Le rapport va au comité"},"story":{"en":"A councillor’s office requests changes to your findings before the staff report is finalized. The comments include confidential resident information.","fr":"Le bureau d’un membre du Conseil demande de modifier vos conclusions avant le rapport final. Les commentaires contiennent des renseignements confidentiels sur des résidents."},"voice":{"en":"“Our advice needs to remain objective.” — City analyst","fr":"« Nos conseils doivent rester objectifs. » — Analyste municipal·e"},"options":[{"label":{"en":"Change the analysis privately to match a preferred outcome.","fr":"Modifier discrètement l’analyse pour soutenir un résultat préféré."},"why":{"en":"Council’s Code of Conduct protects the professional neutrality of staff advice, and privacy rules apply to identifiable comments.","fr":"Le Code de conduite protège l’objectivité des conseils du personnel et les règles de confidentialité s’appliquent aux commentaires identifiables."},"tier":"risk","sources":["conduct","mfippa"]},{"label":{"en":"Provide objective analysis, protect personal data and explain decision options in a public report.","fr":"Fournir une analyse objective, protéger les données et expliquer les options dans un rapport public."},"why":{"en":"Staff provide professional advice to Council while protecting personal information and supporting open decision processes.","fr":"Le personnel fournit des avis professionnels au Conseil tout en protégeant les données personnelles et en soutenant la transparence."},"tier":"good","sources":["conduct","mfippa","meet"]},{"label":{"en":"Remove personal identifiers but omit evidence about dissatisfied participants.","fr":"Retirer les identifiants, mais omettre les commentaires critiques."},"why":{"en":"Removing identifiers reduces privacy risks; selectively omitting perspectives weakens the record.","fr":"Retirer les identifiants diminue le risque, mais omettre des perspectives critiques affaiblit le dossier."},"tier":"mixed","sources":["mfippa","memo"]}],"incident":{"en":"A version of the report circulates with identifiable respondent details.","fr":"Une version du rapport circule avec des détails identifiables sur des répondants."},"repair":{"en":"Escalate the privacy issue promptly and replace the document using City procedures.","fr":"Signaler rapidement le problème de confidentialité et remplacer le document selon les procédures municipales."},"repairBad":{"en":"Leave it online because the consultation was public.","fr":"Le laisser en ligne sous prétexte que la consultation était publique."},"sources":["mfippa","privacy"]},{"title":{"en":"Publish what changed","fr":"Publier ce qui a changé"},"story":{"en":"The committee recommends a modified option. Residents ask which suggestions shaped the report. Leadership wants a two-line announcement with no analysis.","fr":"Le comité recommande une option modifiée. Les résidents veulent savoir quelles suggestions ont influencé le rapport. La direction souhaite une annonce de deux lignes sans analyse."},"voice":{"en":"“Show us what happened to our feedback.” — Resident panel","fr":"« Montrez ce qu’il est advenu de nos commentaires. » — Groupe de résidents"},"options":[{"label":{"en":"Post only a 'Thank you' banner.","fr":"Publier seulement une bannière « Merci »."},"why":{"en":"Courtesy matters, but the refreshed strategy includes reporting back to participants and evaluation of engagement.","fr":"La courtoisie compte, mais la stratégie actualisée prévoit un compte rendu et une évaluation de la participation."},"tier":"risk","sources":["memo","learned"]},{"label":{"en":"Publish an accessible, bilingual 'What We Heard / What We Did' summary with reasons and next steps.","fr":"Publier un bilan accessible et bilingue « Ce que nous avons entendu / Ce que nous avons fait », avec raisons et étapes suivantes."},"why":{"en":"This closes the loop and explains which inputs influenced the project, which could not be adopted and why.","fr":"Cela boucle la consultation et explique quels avis ont été retenus, lesquels ne l’ont pas été et pourquoi."},"tier":"good","sources":["memo","learned","bilingual"]},{"label":{"en":"Release the full raw comment spreadsheet without review.","fr":"Diffuser l’intégralité du fichier brut de commentaires sans examen."},"why":{"en":"Unreviewed raw comments may expose personal information or mislead readers; publish an appropriately reviewed summary.","fr":"Des commentaires bruts non vérifiés peuvent exposer des données personnelles ou induire en erreur; publier une synthèse vérifiée."},"tier":"mixed","sources":["privacy","mfippa"]}],"incident":{"en":"People cannot find a clear account of how the input was considered.","fr":"Les gens ne trouvent pas d’explication claire sur la prise en compte de leurs avis."},"repair":{"en":"Prepare a bilingual, accessible findings and decision-rationale summary.","fr":"Préparer un bilan bilingue accessible des constats et des motifs de la décision."},"repairBad":{"en":"Close the page without adding a results update.","fr":"Fermer la page sans mise à jour sur les résultats."},"sources":["memo","learned"]}],"councillor":[{"title":{"en":"The first briefing","fr":"La première séance d’information"},"story":{"en":"Residents ask whether the Riverbend pilot has been approved. Staff explain that Council sets policy and budgets while professional teams research and implement projects.","fr":"Des résidents demandent si le pilote Riverbend est approuvé. Le personnel explique que le Conseil détermine les politiques et budgets, tandis que les équipes professionnelles étudient et mettent les projets en œuvre."},"voice":{"en":"“Will you listen before choosing?” — Ward resident","fr":"« Allez-vous écouter avant de choisir? » — Résident·e du quartier"},"options":[{"label":{"en":"Explain the decision pathway and invite different perspectives without promising an outcome.","fr":"Expliquer le cheminement décisionnel et inviter divers points de vue sans promettre de résultat."},"why":{"en":"Clear role boundaries protect both public expectations and legitimate Council decisions.","fr":"Des responsabilités claires protègent les attentes du public et le processus légitime du Conseil."},"tier":"good","sources":["conduct","engage"]},{"label":{"en":"Promise all residents that the most popular online poll choice will automatically win.","fr":"Promettre que l’option la plus populaire du sondage en ligne sera automatiquement retenue."},"why":{"en":"A consultation is not automatically a binding vote. This promise overstates how municipal decisions are made.","fr":"Une consultation n’est pas automatiquement un vote contraignant. Cette promesse exagère le fonctionnement des décisions municipales."},"tier":"risk","sources":["engage","conduct"]},{"label":{"en":"Say only that 'the City will decide' and decline questions.","fr":"Dire seulement « la Ville décidera » et refuser les questions."},"why":{"en":"That avoids a promise but misses an opportunity to clarify Council’s role and the available participation channels.","fr":"Cela évite une promesse, mais manque l’occasion de clarifier le rôle du Conseil et les façons de participer."},"tier":"mixed","sources":["engage"]}],"incident":{"en":"Residents now believe the consultation gives them a binding vote.","fr":"Les résidents croient maintenant que la consultation leur donne un vote contraignant."},"repair":{"en":"Clarify the actual level of influence, decision-maker and public input process.","fr":"Préciser le niveau réel d’influence, l’autorité décisionnelle et le processus de participation."},"repairBad":{"en":"Repeat that whichever online faction wins will automatically prevail.","fr":"Répéter que la faction gagnante en ligne l’emportera automatiquement."},"sources":["engage","conduct"]},{"title":{"en":"An unequal invitation list","fr":"Une liste d’invitation inégale"},"story":{"en":"A neighbourhood association requests a private briefing. Transit riders, a Francophone youth group and an accessibility advocate also want information.","fr":"Une association de quartier demande une séance privée. Des usagers du transport, un groupe jeunesse francophone et une personne militante pour l’accessibilité veulent aussi être informés."},"voice":{"en":"“Our voices matter too.” — Youth representative","fr":"« Nos voix comptent aussi. » — Représentant·e jeunesse"},"options":[{"label":{"en":"Hear only from the group most active in your inbox.","fr":"Écouter seulement le groupe le plus actif dans votre boîte courriel."},"why":{"en":"An inbox is not a representative sample. Inclusive outreach should consider who is less likely to be heard.","fr":"Une boîte courriel n’est pas un échantillon représentatif. Une démarche inclusive tient compte des voix moins entendues."},"tier":"risk","sources":["memo","access"]},{"label":{"en":"Encourage varied channels, both official languages and accessible formats for all interested groups.","fr":"Favoriser plusieurs canaux, les deux langues officielles et des formats accessibles pour tous les groupes intéressés."},"why":{"en":"This aligns with Ottawa’s bilingualism, accessibility and refreshed public engagement approach.","fr":"Cela correspond au bilinguisme, à l’accessibilité et à la démarche actualisée de participation d’Ottawa."},"tier":"good","sources":["bilingual","access","memo"]},{"label":{"en":"Offer a public briefing but only in English.","fr":"Offrir une séance publique, mais uniquement en anglais."},"why":{"en":"An open briefing improves access but leaves a language barrier; Ottawa’s Bilingualism Policy recognizes both languages.","fr":"Une séance ouverte améliore l’accès, mais laisse une barrière linguistique; la politique de bilinguisme reconnaît les deux langues."},"tier":"mixed","sources":["bilingual"]}],"incident":{"en":"Residents accuse the process of excluding voices outside one organized group.","fr":"Des résidents estiment que les voix hors d’un seul groupe organisé sont exclues."},"repair":{"en":"Help the team publicize varied accessible and bilingual opportunities without steering submissions.","fr":"Aider l’équipe à annoncer des occasions variées, accessibles et bilingues sans orienter les réponses."},"repairBad":{"en":"Use City resources to promote only one preferred position.","fr":"Utiliser des ressources municipales pour ne promouvoir qu’une seule position."},"sources":["conduct","memo"]},{"title":{"en":"A difficult staff briefing","fr":"Une séance difficile avec le personnel"},"story":{"en":"Staff present trade-offs among possible street layouts. A supporter urges you to order analysts to remove an inconvenient accessibility concern.","fr":"Le personnel présente les compromis entre les aménagements possibles. Une personne vous pousse à ordonner aux analystes de retirer une préoccupation d’accessibilité gênante."},"voice":{"en":"“Our advice needs to be objective.” — Technical lead","fr":"« Nos conseils doivent être objectifs. » — Responsable technique"},"options":[{"label":{"en":"Pressure staff to hide the concern before the public report.","fr":"Faire pression pour cacher la préoccupation avant le rapport public."},"why":{"en":"Ottawa’s Council Code requires respect for the objective and politically neutral role of staff and rejects improper influence.","fr":"Le Code de conduite d’Ottawa exige de respecter l’objectivité et la neutralité du personnel et interdit l’influence indue."},"tier":"risk","sources":["conduct"]},{"label":{"en":"Ask staff to document evidence, trade-offs and accessibility implications, then consider those findings openly.","fr":"Demander de documenter les faits, compromis et impacts sur l’accessibilité, puis examiner ouvertement les constats."},"why":{"en":"Requesting objective evidence respects staff expertise without dictating a political conclusion.","fr":"Demander des faits objectifs respecte l’expertise du personnel sans imposer de conclusion politique."},"tier":"good","sources":["conduct","access"]},{"label":{"en":"Decline the briefing and read only social-media comments.","fr":"Refuser la séance et ne lire que les commentaires sur les réseaux sociaux."},"why":{"en":"Public commentary adds perspective but should not replace the technical and equity evidence available to Council.","fr":"Les commentaires publics ajoutent des points de vue, mais ne remplacent pas les données techniques et d’équité à la disposition du Conseil."},"tier":"mixed","sources":["conduct","memo"]}],"incident":{"en":"An incomplete version of the staff analysis begins circulating.","fr":"Une version incomplète de l’analyse du personnel commence à circuler."},"repair":{"en":"Request a complete, objective briefing through appropriate channels and correct the public record.","fr":"Demander une séance complète et objective par les voies appropriées, et corriger le dossier public."},"repairBad":{"en":"Keep using the partial analysis because it supports a preferred option.","fr":"Continuer à utiliser l’analyse partielle parce qu’elle favorise une option."},"sources":["conduct","accountable"]},{"title":{"en":"Before the vote","fr":"Avant le vote"},"story":{"en":"The project is on a standing committee agenda. Residents ask to deliver deputations and some assume they may address Council directly during its regular meeting.","fr":"Le projet figure à l’ordre du jour d’un comité permanent. Des résidents veulent faire des délégations et d’autres pensent pouvoir s’adresser directement au Conseil en séance ordinaire."},"voice":{"en":"“Please tell us the right venue and deadline.” — Residents","fr":"« Indiquez-nous le bon lieu et la bonne échéance. » — Résidents"},"options":[{"label":{"en":"Tell residents to register to speak at the ordinary Council meeting.","fr":"Dire aux résidents de s’inscrire pour parler à la séance ordinaire du Conseil."},"why":{"en":"Ottawa’s regular Council meetings do not accept public delegations. The committee stage is normally the venue for oral deputations.","fr":"Les séances ordinaires du Conseil n’acceptent pas les délégations publiques. L’étape du comité est normalement prévue à cette fin."},"tier":"risk","sources":["meet","procedure"]},{"label":{"en":"Explain committee registration, the usual five-minute limit, written input and the relevant agenda dates.","fr":"Expliquer l’inscription au comité, la limite habituelle de cinq minutes, les commentaires écrits et les dates de l’ordre du jour."},"why":{"en":"Accurate procedural information supports participation without promising a particular decision.","fr":"Des renseignements procéduraux exacts soutiennent la participation sans promettre une décision particulière."},"tier":"good","sources":["meet","procedure"]},{"label":{"en":"Direct everyone only to the project page, without meeting details.","fr":"Diriger tout le monde uniquement vers la page du projet, sans détails sur les réunions."},"why":{"en":"Engage Ottawa is useful for consultation but does not replace Council and committee meeting procedures.","fr":"Participons Ottawa est utile pour consulter, sans remplacer les procédures du Conseil et des comités."},"tier":"mixed","sources":["meet","engage"]}],"incident":{"en":"Residents miss the opportunity to register a committee deputation.","fr":"Des résidents manquent la période d’inscription pour intervenir au comité."},"repair":{"en":"Point them to the meeting coordinator and written-comment guidance promptly.","fr":"Les orienter rapidement vers la coordination du comité et les consignes de commentaires écrits."},"repairBad":{"en":"Promise a speaking slot at Council that does not exist.","fr":"Promettre une intervention au Conseil qui n’est pas prévue."},"sources":["meet","procedure"]},{"title":{"en":"Explain what happens next","fr":"Expliquer la suite"},"story":{"en":"The final Council decision incorporates some resident proposals and not others. Different groups request an explanation. Your task is to communicate the process, not campaign for a particular design.","fr":"La décision finale du Conseil retient certaines propositions, mais pas d’autres. Différents groupes demandent des explications. Votre tâche est de décrire le processus, non de faire campagne pour un aménagement."},"voice":{"en":"“Which evidence did Council consider?” — Resident panel","fr":"« Quelles données le Conseil a-t-il examinées? » — Groupe de résidents"},"options":[{"label":{"en":"Say the outcome proves every participant agreed.","fr":"Affirmer que le résultat prouve que chaque participant était d’accord."},"why":{"en":"Consultation does not imply consensus. Misstating differing views damages public understanding.","fr":"Une consultation ne signifie pas un consensus. Déformer les divergences nuit à la compréhension publique."},"tier":"risk","sources":["accountable","memo"]},{"label":{"en":"Explain the published rationale, competing concerns, Council’s authority and where to find the record.","fr":"Expliquer les motifs publiés, les préoccupations divergentes, l’autorité du Conseil et où consulter le dossier."},"why":{"en":"This supports accountable, transparent communication without rating the substance of the Council decision.","fr":"Cela favorise une communication responsable et transparente sans juger le fond de la décision du Conseil."},"tier":"good","sources":["accountable","memo"]},{"label":{"en":"Offer only a brief statement without links to the report.","fr":"Ne fournir qu’une brève déclaration sans lien vers le rapport."},"why":{"en":"Brief messages can help, but linking to the decision record and feedback analysis makes the process understandable.","fr":"Les messages courts sont utiles, mais les liens vers les décisions et l’analyse rendent le processus compréhensible."},"tier":"mixed","sources":["memo"]}],"incident":{"en":"People mistake a decision announcement for a full engagement report.","fr":"Des personnes confondent une annonce de décision et un compte rendu complet de consultation."},"repair":{"en":"Share accessible links to the decision record, the consultation summary and future milestones.","fr":"Partager des liens accessibles vers la décision, le bilan de consultation et les prochaines étapes."},"repairBad":{"en":"Dismiss questions because a decision has already been taken.","fr":"Rejeter les questions sous prétexte que la décision est déjà prise."},"sources":["accountable","learned"]}]},"sources":{"strategy":{"title":{"en":"2026 Public Engagement Strategy and Workbook","fr":"Stratégie de participation du public et cahier 2026"},"url":"https://ottawa.ca/en/city-hall/public-engagement/how-were-engaging-you/public-engagement-strategy-and-workbook"},"memo":{"title":{"en":"April 2026 strategy update: engagement cycle and reporting back","fr":"Mise à jour d’avril 2026 : cycle et compte rendu"},"url":"https://ottawa.ca/en/city-hall/open-transparent-and-accountable-government/public-disclosure/memoranda-issued-members-council/memoranda-issued-public-information-and-media-relations/memo-2026-public-engagement-strategy-update-april-1-2026"},"engage":{"title":{"en":"About Engage Ottawa and Public Engagement Protocol","fr":"À propos de Participons Ottawa et du protocole de participation"},"url":"https://engage.ottawa.ca/about-engage-ottawa"},"meet":{"title":{"en":"How to participate in Council and committee proceedings","fr":"Comment participer aux séances du Conseil et des comités"},"url":"https://ottawa.ca/en/city-hall/council-committees-and-boards/get-involved-local-government/how-participate-council-and-committee-proceedings"},"procedure":{"title":{"en":"Council Procedure By-law No. 2025-100","fr":"Règlement de procédure du Conseil no 2025-100"},"url":"https://ottawa.ca/en/living-ottawa/laws-licences-and-permits/laws/laws-z/procedure-law-no-2025-100"},"conduct":{"title":{"en":"Members of Council Code of Conduct — By-law 2025-99","fr":"Code de conduite des membres du Conseil — Règlement 2025-99"},"url":"https://ottawa.ca/en/living-ottawa/laws-licences-and-permits/laws/laws-z/code-conduct-members-council-law-no-2025-99"},"bilingual":{"title":{"en":"Bilingualism Policy / By-law 2001-170","fr":"Politique de bilinguisme / Règlement 2001-170"},"url":"https://ottawa.ca/en/city-hall/creating-equal-inclusive-and-diverse-city/french-language-services/bilingualism-policy"},"access":{"title":{"en":"City of Ottawa Accessibility Policy (2024 revision)","fr":"Politique sur l’accessibilité d’Ottawa (révision 2024)"},"url":"https://ottawa.ca/en/city-hall/city-manager-administration-and-policies/policies/administrative-policies/accessibility-policies-and-procedures/accessibility-policy"},"privacy":{"title":{"en":"Engage Ottawa privacy policy (MFIPPA / PIPEDA)","fr":"Politique de confidentialité de Participons Ottawa (LAIMPVP / LPRPDE)"},"url":"https://engage.ottawa.ca/privacy"},"mfippa":{"title":{"en":"Ottawa overview of MFIPPA and privacy rights","fr":"Ottawa : présentation de la LAIMPVP et des droits à la vie privée"},"url":"https://ottawa.ca/en/city-hall/open-transparent-and-accountable-government/access-information-and-protection-privacy"},"learned":{"title":{"en":"What We Learned: Public Engagement Strategy refresh","fr":"Ce que nous avons appris : actualisation de la stratégie"},"url":"https://engage.ottawa.ca/improving-citys-public-engagement-strategy/news_feed/updated-public-engagement-strategy-and-workbook-now-available"},"accountable":{"title":{"en":"Ottawa Accountability and Transparency Policy","fr":"Politique de responsabilisation et de transparence d’Ottawa"},"url":"https://ottawa.ca/en/city-hall/city-manager-administration-and-policies/policies/administrative-policies/accountability-and-transparency-policy"},"visual":{"url":"https://ottawa.ca/en/city-hall/city-manager-administration-and-policies/policies/visual-identity-program","title":{"en":"City of Ottawa: Visual Identity Program (third-party use requires permission)","fr":"Ville d’Ottawa : Programme d’identité visuelle (autorisation requise pour des tiers)"}},"webaccess":{"url":"https://ottawa.ca/en/city-hall/your-city-government/policies-and-administrative-structure/accessibility-policy","title":{"en":"City of Ottawa: Accessibility Policy and web WCAG 2.0 AA","fr":"Ville d’Ottawa : Politique sur l’accessibilité et WCAG 2.0 AA"}}},"case":{"en":"Riverbend Connections Pilot","fr":"Projet pilote Connexions Riverbend"},"caseDesc":{"en":"Fictional Ottawa neighbourhood. The City is exploring safer crossings, public-space access and connections to transit around a local community hub. The options, budget and timelines are illustrative—not an existing City project.","fr":"Quartier fictif d’Ottawa. La Ville étudie des traversées plus sécuritaires, l’accès aux espaces publics et les liens vers le transport en commun près d’un lieu communautaire. Les options, le budget et l’échéancier sont fictifs : il ne s’agit pas d’un projet municipal existant."}}</script>
<script>
"use strict";
const db=JSON.parse(document.getElementById("game-data").textContent);
const state={lang:"en",screen:"home",role:null,stage:0,focus:null,metrics:{access:55,clarity:55,trust:55,integrity:55},history:[],option:null,repairOutcome:null,points:0,nextAction:null};
const t=(o)=>typeof o==="string"?o:(o?.[state.lang]??"");
const tt=(k)=>db.ui[state.lang][k];
const clamp=(n)=>Math.min(100,Math.max(0,n));
const sourceLink=(k)=>{let s=db.sources[k];return s?`<a target="_blank" rel="noopener noreferrer" href="${s.url}">↗ ${t(s.title)}</a>`:""};
const choicePoints=(tier)=>tier==="good"?20:tier==="mixed"?10:0;
function effects(tier){return tier==="good"?[7,8,6,9]:tier==="mixed"?[1,0,-1,0]:[-10,-9,-11,-10]}
function applyEffect(d){["access","clarity","trust","integrity"].forEach((k,i)=>{state.metrics[k]=clamp(state.metrics[k]+d[i])})}
function setHeader(){
 document.documentElement.lang=state.lang;
 document.title= state.lang==="en"?"Have Your Say · A City Decision":"À vous la parole · Une décision municipale";
 document.getElementById("brandName").textContent=tt("brand");
 document.getElementById("brandSub").textContent=tt("lab");
 document.getElementById("independent").textContent=tt("nonofficial");
 document.getElementById("navSources").textContent=tt("menuSources");
 document.getElementById("footerText").textContent=tt("footer");
 document.getElementById("realPortal").textContent=tt("realPortal");
 document.getElementById("realPortal").href=state.lang==="fr"?"https://participons.ottawa.ca/projects":"https://engage.ottawa.ca/projects";
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang?"true":"false"));
}
const skyline=`<div class="illustration" aria-hidden="true"><svg viewBox="0 0 470 360" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91E3D7"/><stop offset="1" stop-color="#006B60"/></linearGradient></defs>
<rect x="18" y="40" width="430" height="296" rx="24" fill="#E3F3F6"/><circle cx="373" cy="94" r="35" fill="#f7d49a"/><path d="M28 228C134 180 227 267 441 210V318H28Z" fill="#B6E0D7"/><path d="M28 275c95-39 167-13 251 0 77 13 119 17 162-16v61H28Z" fill="url(#river)"/>
<g fill="#004890"><rect x="66" y="130" width="31" height="98" rx="2"/><rect x="100" y="99" width="36" height="129" rx="3"/><rect x="140" y="152" width="25" height="76"/><rect x="169" y="83" width="42" height="145" rx="3"/><rect x="218" y="126" width="36" height="102" rx="3"/><rect x="259" y="110" width="28" height="118"/><rect x="292" y="145" width="30" height="83"/><rect x="328" y="158" width="28" height="70"/><rect x="363" y="120" width="32" height="108"/></g>
<path d="M184 83v-22l-8 8v14h16V69l-8-8" fill="#f6d396"/><path d="M122 99v-29h-8v29M270 110V85h-7v25" stroke="#d5efe4" stroke-width="4"/>
<g stroke="#b6dfd8" stroke-width="2" opacity=".8"><path d="M76 146v9m0 8v9m35-57v9m11-9v9m60-27v12m13-12v12m36 46v12m42-30v9M379 140v12"/></g>
<path d="M45 245Q235 200 424 248" fill="none" stroke="#f9faf2" stroke-width="9"/><path d="M45 245Q235 200 424 248" fill="none" stroke="#456a6d" stroke-width="2" stroke-dasharray="12 12"/>
<g><circle cx="84" cy="245" r="17" fill="#f6d39a"/><path d="M84 237v17m-8-8h16" stroke="#00376D" stroke-width="3" stroke-linecap="round"/><circle cx="312" cy="251" r="17" fill="#f6d39a"/><path d="M305 251h14m-7-7v14" stroke="#00376D" stroke-width="3" stroke-linecap="round"/></g>
<path d="M29 329h413" stroke="#ffffffe0" stroke-width="4"/>
<rect x="256" y="22" width="158" height="48" rx="13" fill="#fff"/><circle cx="278" cy="46" r="10" fill="#006B60"/><path d="M275 46l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="298" y="36" width="93" height="5" rx="2.5" fill="#588C9E"/><rect x="298" y="47" width="65" height="5" rx="2.5" fill="#b3d1cb"/>
</svg></div>`;
function bannerCard(){return `<section class="wrap case-ribbon" aria-label="${tt("projectTitle")}"><div class="case-icon" aria-hidden="true">🌿</div><div><strong>${tt("projectTitle")}: ${t(db.case)}</strong><p>${t(db.caseDesc)}</p></div><span class="pill">${tt("fiction")}</span></section>`}
function sourcesHTML(showAll=false,keys=[]){let ids=showAll?Object.keys(db.sources):[...new Set(keys)];
return ids.map(k=>{let s=db.sources[k];return `<article class="source-entry"><div><span class="tag">${k}</span><a href="${s.url}" target="_blank" rel="noopener noreferrer">${t(s.title)} ↗</a></div><span aria-hidden="true">↗</span></article>`}).join("")}
function home(){
 return `<section class="hero"><div class="wrap hero-inner"><div>
 <div class="eyebrow">${tt("eyebrow")}</div><h1 id="screen-title" tabindex="-1">${tt("heroTitle")}<span class="highlight">${tt("heroAccent")}</span></h1>
 <p>${tt("heroDesc")}</p><div class="hero-actions"><button class="button button-primary" data-action="start">${tt("begin")} <span aria-hidden="true">→</span></button><a href="#sources" class="button button-outline">${tt("preview")}</a></div>
 <p style="font-size:.85rem;color:#EAF6FF;margin-top:13px">${tt("startNote")}</p><div class="hero-facts"><span><strong>03</strong>${tt("rolesNum")}</span><span><strong>05</strong>${tt("chapNum")}</span><span><strong>~15</strong>${tt("timeNum")}</span></div>
 </div>${skyline}</div></section>${bannerCard()}${introPanel()}
 <section class="wrap section"><div class="section-label">${tt("journey")}</div><h2>${tt("rolesHeading")||tt("roleHeading")}</h2><p class="lead">${tt("roleHelp")}</p>
 <div class="role-grid">${Object.entries(db.roles).map(([k,r])=>roleCard(k,r)).join("")}</div>
 <div class="flow-strip"><strong>${tt("journey")}</strong><div class="flow-grid">${tt("phases").map((p,i)=>`<span class="flow-step"><b>${i+1}</b>${p}</span>`).join("")}</div></div>
 <p class="notice" style="margin-top:21px">⚑ ${tt("noVote")}</p></section>${allSources()}`;
}
function introPanel(){return `<section class="wrap intro-panel" aria-labelledby="intro-heading">
<div class="intro-eyebrow">${tt("introEyebrow")}</div><h2 id="intro-heading">${tt("introTitle")}</h2>
<p>${tt("introBody")}</p><small>✓ ${tt("introFoot")} · ${tt("maxPoints")}</small></section>`}
function roleCard(k,r){return `<button class="role-card" data-role="${k}"><span class="role-icon" aria-hidden="true">${r.icon}</span><strong>${t(r.name)}</strong><span class="sub">${t(r.short)}</span><p>${t(r.desc)}</p><span class="role-arrow">${tt("playRole")} <span aria-hidden="true">↗</span></span></button>`}
function allSources(){return `<section id="sources" class="sources"><div class="wrap"><div class="section-label">${tt("evidence")}</div><h2>${tt("sourceHeading")}</h2><p class="lead">${tt("sourceIntro")}</p><div class="sources-list">${sourcesHTML(true)}</div><p class="notice" style="margin-top:17px">${tt("evidenceNote")} ${tt("nonofficial")}</p></div></section>`}
function roleSelect(){
 return `<div class="wrap section"><div class="section-label">${tt("roleEyebrow")}</div><h1 style="color:var(--navy);font-size:clamp(2rem,4vw,3rem)" id="screen-title" tabindex="-1">${tt("roleHeading")}</h1><p class="lead">${tt("roleHelp")}</p>${introPanel()}
 <div class="role-grid">${Object.entries(db.roles).map(([k,r])=>roleCard(k,r)).join("")}</div><p class="notice" style="margin-top:22px">${tt("noVote")}</p>
 <div class="flow-strip"><strong>${tt("journey")}</strong><div class="flow-grid">${tt("phases").map((p,i)=>`<span class="flow-step"><b>${i+1}</b>${p}</span>`).join("")}</div></div></div>`}
function statPanel(){
let metrics=state.metrics;const titles={access:tt("access"),clarity:tt("clarity"),trust:tt("trust"),integrity:tt("integrity")};
return `<aside class="stat-card" aria-label="${tt("statsTitle")}"><h3>◈ ${tt("statsTitle")}</h3><p>${tt("statsExplanation")}</p><div class="metric-stack">${Object.entries(metrics).map(([k,v])=>`<div class="stat-row"><div class="labels"><span>${titles[k]}</span><b>${v}</b></div><div class="bar" role="progressbar" aria-label="${titles[k]}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><span style="width:${v}%"></span></div></div>`).join("")}</div><div class="small-pulse">${tt("noteOpt")}</div></aside>`}
function stageProgress(){
let p=Math.round(state.stage/5*100);
return `<div class="progress-box"><div class="progress-header"><strong>${t(db.roles[state.role].name)} · ${tt("chapter")} ${state.stage+1} ${tt("of")} 5</strong><span>${p}%</span></div><div class="progress-track" role="progressbar" aria-label="${tt("journey")}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><div style="width:${p}%"></div></div><div class="progress-labels">${tt("phases").map((label,i)=>`<span class="${state.stage===i?"active":""}">${label}</span>`).join("")}</div></div>`}
function gameTop(){return `<div class="top-game"><span class="pill">${t(db.roles[state.role].character)}</span><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="score-chip" aria-label="${tt("pointsLabel")}: ${state.points} ${tt("maxPoints")}">${tt("pointsLabel")}: ${state.points}/100</span><button class="small-action" data-action="roles">${tt("changeRole")}</button> <button class="small-action" data-action="reset">${tt("reset")}</button></div></div>`}
function evidenceLinks(ids){return `<div class="evidence-links">${[...new Set(ids)].map(k=>sourceLink(k)).join("")}</div>`}
function stageView(){
let s=db.game[state.role][state.stage];return `<div class="wrap game-shell">${gameTop()}${stageProgress()}<div class="play-grid"><div class="story-card">
<div class="section-label">${tt("storyLabel")} · ${tt("questionCount")} ${state.stage+1}</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${t(s.title)}</h1>
<div class="role-motivation"><strong>${tt("roleInvite")}:</strong> ${tt("roleMotivation")[state.role]}</div><p class="story-text">${t(s.story)}</p><blockquote class="character-voice">${t(s.voice)}</blockquote>
<div class="question-header"><h3>${tt("choose")}</h3><p>${tt("chooseHelp")}</p></div>
<div class="choices">${s.options.map((o,i)=>`<button class="choice-button" data-choice="${i}"><span class="choice-no">${String.fromCharCode(65+i)}</span><span class="choice-copy">${t(o.label)}</span><span class="arrow" aria-hidden="true">→</span></button>`).join("")}</div>
<div class="sources-callout"><strong>${tt("evidence")}:</strong>${evidenceLinks(s.sources)}</div></div>${statPanel()}</div></div>`}
function feedbackView(){
let s=db.game[state.role][state.stage],o=s.options[state.option], tier=o.tier;return `<div class="wrap game-shell">${gameTop()}${stageProgress()}<div class="play-grid"><section class="story-card">
<div class="section-label">${tt("feedback")}</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${t(s.title)}</h1><div class="debrief ${tier}">
<span class="badge">${tier==="good"?"✓ "+tt("feedbackGood"):tier==="mixed"?"◇ "+tt("feedbackMixed"):"! "+tt("feedbackRisk")}</span><h3>${t(o.label)}</h3><p>${t(o.why)}</p></div><div class="choice-points">+${choicePoints(tier)} / 20 · ${tt("pointsEarned")}</div>
<p class="notice">${tt("hint")}: ${tt("evidenceNote")}</p>${evidenceLinks(o.sources)}
<div class="game-actions"><button class="button button-dark" data-action="afterfeedback">${tt("continue")} <span aria-hidden="true">→</span></button></div>
</section>${statPanel()}</div></div>`}
function crisisView(){
let s=db.game[state.role][state.stage];
return `<div class="wrap game-shell">${gameTop()}${stageProgress()}<div class="play-grid"><section class="story-card">
<div class="section-label">${tt("crisisLabel")}</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${tt("crisisTitle")}</h1>
<div class="incident-art">⚡ ${t(s.incident)}</div><p class="story-text">${tt("crisisLead")}</p>
<div class="question-header"><h3>${tt("incidentChoice")}</h3></div>
<div class="choices"><button class="choice-button" data-repair="good"><span class="choice-no">A</span><span class="choice-copy">${t(s.repair)}</span><span class="arrow">→</span></button>
<button class="choice-button" data-repair="risk"><span class="choice-no">B</span><span class="choice-copy">${t(s.repairBad)}</span><span class="arrow">→</span></button></div>
${evidenceLinks(s.sources)}</section>${statPanel()}</div></div>`}
function repairFeedback(){
let s=db.game[state.role][state.stage];
return `<div class="wrap game-shell">${gameTop()}${stageProgress()}<div class="play-grid"><section class="story-card">
<div class="section-label">${tt("incidentFeedback")}</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${tt("outcome")}</h1><div class="debrief ${state.repairOutcome==="good"?"good":"risk"}">
<h3>${state.repairOutcome==="good"?tt("repair"):tt("doubleDown")}</h3><p>${state.repairOutcome==="good"?tt("repairOk"):tt("repairBad")}</p><div class="choice-points">+${state.repairOutcome==="good"?5:0} ${tt("pointsEarned")}</div></div>
${evidenceLinks(s.sources)}<div class="game-actions"><button class="button button-dark" data-action="next">${tt("continueTo")} →</button></div>
</section>${statPanel()}</div></div>`}

function officialNextUrl(k){
 const urls={
  projects:state.lang==="fr"?"https://participons.ottawa.ca/projects":"https://engage.ottawa.ca/projects",
  committee:state.lang==="fr"?"https://ottawa.ca/fr/hotel-de-ville/conseil-municipal-comites-et-conseils/jouer-un-role-dans-la-collectivite-locale/participez-aux-deliberations-lors-des-reunions-du-conseil-municipal-et-des-comites":"https://ottawa.ca/en/node/1000138",
  report:"https://engage.ottawa.ca/improving-citys-public-engagement-strategy/news_feed/updated-public-engagement-strategy-and-workbook-now-available"};
 return urls[k];
}
function nextActionDetail(){
 if(!state.nextAction)return `<p>${tt("nextChoose")}</p>`;
 const id=state.nextAction;
 return `<p>${tt("nextDescriptions")[id]}</p><a class="button" href="${officialNextUrl(id)}" target="_blank" rel="noopener noreferrer">${tt("openOfficial")} <span aria-hidden="true">↗</span></a>`;
}
function nextSteps(){
 return `<section class="next-steps" aria-labelledby="next-title"><div class="section-label">${tt("resultMomentum")}</div>
 <h3 id="next-title">${tt("nextTitle")}</h3><p>${tt("nextBody")}</p>
 <div class="next-action-grid" role="group" aria-label="${tt("myAction")}">${["projects","committee","report"].map((id,i)=>`<button type="button" data-plan="${id}" aria-pressed="${state.nextAction===id}">${i+1}. ${tt("nextChoices")[id]}</button>`).join("")}</div>
 <div class="next-step-detail" id="nextStepDetail" role="status" aria-live="polite">${nextActionDetail()}</div>
 <p class="next-note">${tt("nonofficial")}</p></section>`;
}
function selectNextAction(id){
 if(!["projects","committee","report"].includes(id))return;
 state.nextAction=id;
 document.querySelectorAll("[data-plan]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.plan===id?"true":"false"));
 const detail=document.getElementById("nextStepDetail");if(detail)detail.innerHTML=nextActionDetail();
}
function resultView(){
let score=state.points;
let level=score>=75?tt("strong"):score>=55?tt("developing"):tt("learning");
return `<div class="wrap game-shell results-wrap"><div class="top-game"><span class="pill">${t(db.roles[state.role].character)}</span><button class="small-action" data-action="roles">${tt("replay")}</button></div>
<section class="result-hero"><div class="section-label">${tt("resultsEyebrow")}</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${tt("resultTitle")}</h1><p>${tt("resultDesc")}</p><div class="result-score"><div class="score-circle">${score}</div><div><strong style="font-size:1.15rem">${level}</strong><p style="margin:4px 0 0">${tt("scoreLabel")} · ${tt("maxPoints")}</p></div></div>
<p class="score-explainer" style="color:#EAF5FF">${tt("scoreHelp")}</p></section>
<div class="summary-grid"><section class="summary-card"><h3>${tt("resultNext")}</h3><p class="score-explainer">${tt("pointRule")}</p><ul>${tt("takeaways").map(x=>`<li>${x}</li>`).join("")}</ul></section><section class="summary-card"><h3>${tt("statsTitle")}</h3>${statPanel().replace('class="stat-card"','class="stat-card" style="position:static;border:0;padding:0;box-shadow:none"')}</section></div>
<section class="summary-card" style="margin-top:17px"><h3>${tt("history")}</h3>${state.history.filter(h=>h.type==="choice").map((h,i)=>`<div class="history-item"><span class="chapter">${tt("chapter")} ${h.stage+1} · ${t(db.game[state.role][h.stage].title)}</span><p>${t(db.game[state.role][h.stage].options[h.index].label)}</p></div>`).join("")}</section>${nextSteps()}
<div class="game-actions"><button class="button button-dark" data-action="download">↓ ${tt("download")}</button><button class="button button-secondary" data-action="print">▤ ${tt("print")}</button><button class="button button-secondary" data-action="roles">${tt("replay")}</button></div>
<p class="notice" style="margin-top:20px">${tt("privacyNote")} ${tt("noVote")}</p>
</div>${allSources()}`}
function render(focusTitle=false){
 setHeader();
 let html=state.screen==="home"?home():state.screen==="roles"?roleSelect():state.screen==="stage"?stageView():state.screen==="feedback"?feedbackView():state.screen==="crisis"?crisisView():state.screen==="repairFeedback"?repairFeedback():resultView();
 document.getElementById("app").innerHTML=html;
 if(focusTitle){document.getElementById("screenStatus").textContent=document.getElementById("screen-title")?.textContent||""}
 if(focusTitle){window.scrollTo({top:0,behavior:"instant"});document.getElementById("screen-title")?.focus({preventScroll:true})}
}
function roleStart(role){if(!db.roles[role])return;state.role=role;state.stage=0;state.option=null;state.history=[];state.repairOutcome=null;state.points=0;state.nextAction=null;state.metrics={access:55,clarity:55,trust:55,integrity:55};state.screen="stage";render(true)}
function choose(i){let s=db.game[state.role][state.stage],o=s.options[i];if(!o)return;state.option=i;state.points=Math.min(100,state.points+choicePoints(o.tier));applyEffect(effects(o.tier));state.history.push({type:"choice",stage:state.stage,index:i,tier:o.tier});state.screen="feedback";render(true)}
function next(){state.stage++;state.option=null;state.repairOutcome=null;state.screen=state.stage>=5?"results":"stage";render(true)}
function repair(how){state.repairOutcome=how;if(how==="good")state.points=Math.min(100,state.points+5);applyEffect(how==="good"?[4,5,6,5]:[-5,-5,-5,-5]);state.history.push({type:"repair",stage:state.stage,how});state.screen="repairFeedback";render(true)}
function downloadSummary(){let score=state.points;
let text=[tt("resultTitle"),tt("independent"),t(db.roles[state.role].name),tt("scoreLabel")+": "+score+"/100","",...state.history.filter(h=>h.type==="choice").map(h=>`${tt("chapter")} ${h.stage+1}: ${t(db.game[state.role][h.stage].title)}\n${t(db.game[state.role][h.stage].options[h.index].label)}\n${t(db.game[state.role][h.stage].options[h.index].why)}\n`),tt("noVote"),tt("pointRule"),state.nextAction?tt("myAction")+": "+tt("nextChoices")[state.nextAction]+" — "+officialNextUrl(state.nextAction):"",officialNextUrl("projects")].join("\n");
let blob=new Blob([text],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=state.lang==="fr"?"bilan_simulation_ottawa.txt":"ottawa_simulation_summary.txt";a.click();URL.revokeObjectURL(url)}
document.addEventListener("click",e=>{
let plan=e.target.closest("[data-plan]");if(plan){selectNextAction(plan.dataset.plan);return}
let lang=e.target.closest("[data-lang]");if(lang){state.lang=lang.dataset.lang;render(false);return}
let role=e.target.closest("[data-role]");if(role){roleStart(role.dataset.role);return}
let choice=e.target.closest("[data-choice]");if(choice){choose(Number(choice.dataset.choice));return}
let recovery=e.target.closest("[data-repair]");if(recovery){repair(recovery.dataset.repair);return}
let action=e.target.closest("[data-action]");if(!action)return;
if(action.tagName==="A")e.preventDefault();
switch(action.dataset.action){
 case "home":state.screen="home";render(true);break;
 case "start":case "roles":state.screen="roles";render(true);break;
 case "reset":roleStart(state.role);break;
 case "afterfeedback":{let o=db.game[state.role][state.stage].options[state.option];if(o.tier==="risk"){state.screen="crisis";render(true)}else next();break}
 case "next":next();break;
 case "download":downloadSummary();break;
 case "print":window.print();break;
 }
});
render();
</script>
<script>
/* Learning Lab v2 layer — Have Your Say (added 2026-11-19).
   Pure addition: the game's data and logic are untouched. Adds a casebook,
   a richer ending (badge + wish, your pattern, designed pitfalls, other

(function () {

  var GAME = 'have-your-say';
  var DB = null;
  try { DB = JSON.parse(document.querySelector('script[id="game-data"], script#game-data').textContent); } catch (e) { DB = null; }
  if (!DB || !DB.game) { try { DB = Function('return typeof db!=="undefined"?db:null')(); } catch (e) { DB = null; } }
  if (!DB || !DB.game) return;

  var STR = {
    en: {
      casebookBtn: 'Casebook', casebookTitle: 'Casebook — missions, sound practice, sources',

      historyNote: 'Saved only in this browser, on this device. Nothing is sent to the City or to any server.',
      plays: 'plays', best: 'best', latest: 'latest scores',
      bands: [
        { min: 100, name: 'Voice of the City', wish: 'May every voice you invite in be heard, counted honestly, and answered.' },
        { min: 85, name: 'Trusted Facilitator', wish: 'One repair away from flawless — may your next process close the gap.' },
        { min: 70, name: 'Community Builder', wish: 'You are building the habits that make public decisions trustworthy. Keep going.' },
        { min: 40, name: 'Civic Apprentice', wish: 'Every facilitator started by listening. Try another role and hear the same pilot differently.' },
        { min: 0, name: 'First Steps', wish: 'Showing up is the first civic skill. The casebook shows the stronger path for every mission — the next run is yours.' }
      ]
    },
    fr: {
      casebookBtn: 'Carnet de cas', casebookTitle: 'Carnet de cas — missions, pratique et sources',
      casebookIntro: 'Chaque mission du jeu, la pratique qu’elle enseigne et les sources officielles qui la soutiennent — tout le parcours du projet pilote Connexions Riverbend au même endroit.',
      practice: 'Pratique recommandée', source: 'Sources', close: 'Fermer',
      badgeKicker: 'Votre insigne', patternTitle: 'Votre profil de décision',
      patternNone: 'Aucun choix risqué cette fois — chaque décision a suivi la pratique la plus solide.',
      patternRisk: 'Là où le risque était :', patternPartial: 'Là où une option plus solide existait :',
      pitfallsTitle: 'Les pièges que ce jeu apprend à repérer',
      pitfallsIntro: 'Voici les pièges de décision intégrés à cette simulation — ceux dans lesquels les processus de consultation réels tombent le plus facilement :',
      pitfalls: [
        'Partager une rumeur ou une publication virale comme s’il s’agissait d’un fait confirmé.',
        'Traiter un sondage en ligne auto-sélectionné comme représentatif de tout le monde.',
        'Ne recueillir que les commentaires qui vont dans votre sens.',
        'Déformer le processus — présenter une consultation comme un vote contraignant, ou promettre que l’option la plus populaire gagnera automatiquement.',
        'Tout lancer en ligne et promettre de régler les problèmes d’accès plus tard.',
        'Modifier l’analyse en privé, ou presser le personnel de cacher une préoccupation, pour que le dossier corresponde au résultat souhaité.',
        'Terminer par une bannière de remerciement au lieu de rendre compte de l’usage des commentaires.'
      ],
      lensesTitle: 'Par d’autres yeux',
      lensesIntro: 'Le même projet pilote Riverbend, vu depuis les autres rôles. Jouer un autre rôle est le moyen le plus rapide de sentir d’où viennent ses contraintes :',
      historyTitle: 'Vos résultats précédents sur cet appareil',
      historyNote: 'Enregistré uniquement dans ce navigateur, sur cet appareil. Rien n’est envoyé à la Ville ni à aucun serveur.',
      plays: 'parties', best: 'meilleur', latest: 'derniers résultats',
      bands: [
        { min: 100, name: 'Voix de la cité', wish: 'Que chaque voix que vous invitez soit entendue, comptée honnêtement et reçoive une réponse.' },
        { min: 85, name: 'Facilitateur de confiance', wish: 'À une correction de la perfection — que votre prochain processus comble l’écart.' },
        { min: 70, name: 'Bâtisseur communautaire', wish: 'Vous construisez les habitudes qui rendent les décisions publiques dignes de confiance. Continuez.' },
        { min: 40, name: 'Apprenti civique', wish: 'Chaque facilitateur a commencé par écouter. Essayez un autre rôle et entendez le même projet autrement.' },
        { min: 0, name: 'Premiers pas', wish: 'Être présent est la première compétence civique. Le carnet de cas montre la voie la plus solide pour chaque mission — la prochaine partie est à vous.' }
      ]
    }
  };

  function lang() { return (document.documentElement.lang || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'; }
  function L() { return STR[lang()]; }
  function li(v) { var l = lang(); if (v && typeof v === 'object') return v[l] || v.en || ''; return v == null ? '' : v; }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function state() { try { return Function('return typeof state!=="undefined"?state:null')(); } catch (e) { return null; } }

  /* ---------- casebook ---------- */
  var overlay = null;
  function buildCasebook() {
    var t = L(), out = ['<div class="v2-cb-head"><h2>' + esc(t.casebookTitle) + '</h2><button type="button" class="v2-btn" data-v2="close">' + esc(t.close) + '</button></div><p class="v2-cb-intro">' + esc(t.casebookIntro) + '</p>'];
    Object.keys(DB.game).forEach(function (rk) {
      var role = DB.roles[rk];
      out.push('<h3 class="v2-cb-role">' + esc(li(role.name)) + ' — ' + esc(li(role.character)) + '</h3>');
      DB.game[rk].forEach(function (m, i) {
        var good = m.options.filter(function (o) { return o.tier === 'good'; })[0] || m.options[0];
        var srcs = (m.sources || []).map(function (k) { var s = DB.sources[k]; return s ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(li(s.title)) + '</a>' : ''; }).filter(Boolean).join(' · ');
        out.push('<article class="v2-card"><h4>' + (i + 1) + '. ' + esc(li(m.title)) + '</h4><p>' + esc(li(m.story)) + '</p>' +
          '<p class="v2-practice"><strong>' + esc(t.practice) + ':</strong> ' + esc(li(good.label)) + '</p><p class="v2-why">' + esc(li(good.why)) + '</p>' +
          (srcs ? '<p class="v2-src">' + esc(t.source) + ': ' + srcs + '</p>' : '') + '</article>');
      });
    });
    return out.join('');
  }
  function openCasebook() {
    closeCasebook();
    overlay = document.createElement('div');
    overlay.className = 'v2-overlay'; overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = '<div class="v2-sheet">' + buildCasebook() + '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('[data-v2="close"]').addEventListener('click', closeCasebook);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeCasebook(); });
    var c = overlay.querySelector('[data-v2="close"]'); if (c) c.focus();
  }
  function closeCasebook() { if (overlay) { overlay.remove(); overlay = null; } }

  var cbBtn = document.createElement('button');
  cbBtn.type = 'button'; cbBtn.className = 'v2-fab'; cbBtn.addEventListener('click', openCasebook);
  document.body.appendChild(cbBtn);
  function syncFab() { var txt = '📖 ' + L().casebookBtn; if (cbBtn.textContent !== txt) cbBtn.textContent = txt; }
  syncFab();

  /* ---------- ending panel ---------- */
  var recorded = false, panelFor = null;
  function band(score) { var bs = L().bands; for (var i = 0; i < bs.length; i++) if (score >= bs[i].min) return bs[i]; return bs[bs.length - 1]; }
  function history() { try { return JSON.parse(localStorage.getItem('llab.v2.' + GAME) || '[]'); } catch (e) { return []; } }
  function record(score, role) {
    try {
      var hst = history(); hst.push({ score: score, role: role || '', ts: Date.now() });
      if (hst.length > 50) hst = hst.slice(hst.length - 50);
      localStorage.setItem('llab.v2.' + GAME, JSON.stringify(hst));
    } catch (e) {}
    try { window.parent.postMessage({ type: 'llab-result', game: GAME, score: score, role: role || '', lang: lang() }, '*'); } catch (e) {}
  }
  function patternHtml(st) {
    var t = L();
    if (!st || !st.history || !DB.game[st.role]) return '';
    var risks = [], partials = [];
    st.history.filter(function (hh) { return hh.type === 'choice'; }).forEach(function (hh) {
      var m = DB.game[st.role][hh.stage]; if (!m) return;
      var opt = m.options[hh.index]; if (!opt) return;
      if (hh.tier === 'risk') risks.push('<li><strong>' + esc(li(m.title)) + '</strong> — ' + esc(li(opt.why)) + '</li>');
      else if (hh.tier === 'mixed') partials.push('<li><strong>' + esc(li(m.title)) + '</strong> — ' + esc(li(opt.why)) + '</li>');
    });
    var out = '<h3>' + esc(t.patternTitle) + '</h3>';
    if (!risks.length && !partials.length) out += '<p>' + esc(t.patternNone) + '</p>';
    if (risks.length) out += '<p class="v2-sub">' + esc(t.patternRisk) + '</p><ul class="v2-list">' + risks.join('') + '</ul>';
    if (partials.length) out += '<p class="v2-sub">' + esc(t.patternPartial) + '</p><ul class="v2-list">' + partials.join('') + '</ul>';
    return out;
  }
  function lensesHtml(st) {
    var t = L();
    if (!st || !st.role) return '';
    var others = Object.keys(DB.roles).filter(function (rk) { return rk !== st.role; });
    if (!others.length) return '';
    var out = '<h3>' + esc(t.lensesTitle) + '</h3><p>' + esc(t.lensesIntro) + '</p>';
    others.forEach(function (rk) {
      var r = DB.roles[rk];
      out += '<div class="v2-lens"><strong>' + esc(li(r.name)) + '</strong> — ' + esc(li(r.short)) + '<br><span>' + esc(li(r.desc)) + '</span></div>';
    });
    return out;
  }
  function historyHtml() {
    var t = L(), hst = history();
    if (!hst.length) return '';
    var best = Math.max.apply(null, hst.map(function (x) { return x.score; }));
    var last = hst.slice(-5).map(function (x) { return x.score; }).join(' · ');
    return '<h3>' + esc(t.historyTitle) + '</h3><p>' + hst.length + ' ' + esc(t.plays) + ' · ' + esc(t.best) + ': ' + best + '/100 · ' + esc(t.latest) + ': ' + last + '</p><p class="v2-note">' + esc(t.historyNote) + '</p>';
  }
  function injectPanel() {
    var st = state(); if (!st || typeof st.points !== 'number') return;
    var host = document.querySelector('.results-wrap'); if (!host) return;
    if (panelFor === st && host.querySelector('.v2-panel')) return;
    var old = host.querySelector('.v2-panel'); if (old) old.remove();
    var t = L(), b = band(st.points);
    var el = document.createElement('div');
    el.className = 'v2-panel';
    el.innerHTML =
      '<div class="v2-badge"><div class="v2-badge-medal" aria-hidden="true">★</div><div><div class="v2-kicker">' + esc(t.badgeKicker) + '</div>' +
      '<div class="v2-badge-name">' + esc(b.name) + '</div><p class="v2-wish">' + esc(b.wish) + '</p></div></div>' +
      patternHtml(st) +
      '<h3>' + esc(t.pitfallsTitle) + '</h3><p>' + esc(t.pitfallsIntro) + '</p><ul class="v2-list">' + t.pitfalls.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
      lensesHtml(st) +
      '<div class="v2-hist">' + historyHtml() + '</div>' +
      '<p><button type="button" class="v2-btn" data-v2="cb">' + esc(t.casebookBtn) + '</button></p>';
    host.appendChild(el);
    el.querySelector('[data-v2="cb"]').addEventListener('click', openCasebook);
    panelFor = st;
    if (!recorded) { record(st.points, st.role); recorded = true; var hh = el.querySelector('.v2-hist'); if (hh) hh.innerHTML = historyHtml(); }
  }
  var obs = new MutationObserver(function () {
    syncFab();
    var onEnd = !!document.querySelector('.results-wrap');
    if (onEnd) injectPanel();
    else { recorded = false; panelFor = null; }
  });
  obs.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['lang'] });
})();
